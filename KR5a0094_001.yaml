front:
  text: 太上洞玄靈寶無量度人上品經法卷之一
  hash: sha256:917ae63f28f0cf656fd0a28319f39beda65b77f24fc59d7d461d276a3a0a13e3
body:
  text: 太上三五都功職籙弟子陳椿榮集注萬聖尊崇衆真欽仰無上可上玄之又玄洞玄靈寶是品秩之名無量度人即一卷之目諸經所宗故曰上品功用微妙是為妙經叙玄章道言酉文上清玉晨大道君靈寶天尊之言也道君序經故以道言為首玄師曰凡有道言皆玉晨大道君自序非二章之首昔於始青天中始青天王隆騰勝天也碧落空歌卯文大浮黎土離文浮黎玉隆天帝內諱也受元始度人無量上品玉晨大道君為靈寶教主乃元始天尊之弟子太微天帝君之師也受靈寶上品度人之道啓運章元始天尊注元始天尊是虛皇之應號也從真起應則曰證修妙思幽源乃自性獨有洞神經曰妙象無形應感有體真精之氣化成姿容當說是經周回十過以召十方元始天尊為道法宗主當此劫運開圖出教說法傳經先周召十方天真然後登座法曰元始天尊元自己元神一身之主也真應章始當詣座子至午文挑座者空玄之座言方始當詣其座天真大神上清文上元至真九品之真御注是出三界無修證無位業之高真上聖高尊玉清文中元聖尊九品之聖御注是有修證有位業之上聖妙行真人太清文下元仙真九品真人御注是無為無作之真人皆在玉清之境出離三界之天也此三號天真比一身則屬上部八景神氣無鞅數衆乘空而來飛雲丹霄緑輿瓊輪羽蓋垂蔭流精玉光亥文流精玉光是九色圓象又曰日月氣天之靈寶也可以採鍊餌之成真五色鬱勃酉文洞煥太空定極章定觀法大洞境界七日七夜諸天日月星宿璇璣玉衡一時停輪玄師曰既言日月停輪何以分其七日七夜之數乃天尊妙用神通化機運感之所致此之微妙聖應天尊外化日月不行星宿不運璇璣玉衡一時停輪不顯晝夜其實內運主宰功用未嘗暫停故玉晨明七日七夜之數又非人世七日七夜之比以內言之大定神光湛然見玉清境有七日七夜之功也日月停輪二目不瞬也即非冥目亦非內視亦非臨目是七日七夜久視停其目瞬照明三部內外洞然其一身氣血朝運於百節經絡陰陽營衛皆係於三部脉息其息乃人之一身璇璣玉衡也四至為璇璣三部為玉衡既是璇璣不運日月駐景星宿停輪四至不至則三部不息一身氣血俱不運轉御注兀然泰定與神氣合也四星為璇璣三星為玉衡璇璣一呼一吸四至共得六寸玉一呼二至一吸二至各得三寸𢖍一至得十五分經歸天地縱之橫十五故圖上帝付黃帝河圖也靈寶內象丹㫖曰人之一氣往來者呼吸是也夫人一呼一吸而為一息一息之間則分陰陽呼而明為陽為晝吸而晦為陰為夜七竅之呼七日也七竅之吸七夜也天機不動神凝目住脉定心停故曰七日七夜日月星宿璇璣玉衡一時停輪也神風靜默無吹噓出入之息山海藏雲子文無蔽明妄想之業天無浮翳清明湛寂也四氣朗清卯文自然溫凉寒燠也一國地土猶一身也山川林木猶四肢百脉毛髮孔竅營衛骨節也緬平一等無復高下土皆作碧玉無有異色入於道定之境湛然體性一身內外皆如碧玉無一毫之塵也玄師曰定觀七日不知晝夜觀心無心乃是真元之心觀形無形乃識本始真形心形都無自入無形之道此乃大定神光湛然見玉清境有七日七夜之功也衆真侍座玉清文天尊以大法而感召十万天真則隨感而咸集亦猶收神氣海藏息丹田則三萬六千神官自侍左右還元章元始天尊玄坐空浮五色獅子之上午文玄師曰天尊空浮乃自己元神居玉清宫玄坐者法身所御也獅子者元始威神也是五氣朝絳宫威神之妙化結成獅子天尊乘之下入丹田左青右白前赤後黑中黃故有五色獅子之象因成五行說經一遍諸天大聖同時稱善是時一國男女聾病耳皆開聰天一生水也乃坎之氣孕於乾金諸天大聖同時稱善者萬神一時俱暢一國男女者法身陰陽二氣聾病者坎為耳故屬之玄師曰至道言之迷音不知音外真病耳不聽無聲大聰亦聾御注何謂之聾以耳無聽德之善故也一聞天尊說法則天耳開聰法音流響洞然無礙也餘同此說說經二遍盲者目明地二生火也乃離之氣孕於巽木離為目目應心心昧於物暗而若盲依道而行心開音悟物莫能蔽邪說經三遍喑者能言天三生木也乃震之氣孕於艮水艮為山山高土厚水泉出焉說經四遍跛痾積逮皆能起行地四生金也乃兊之氣孕於坤土起行者乃植立之狀木性有焉說經五遍久病痼疾一時復形天五生土也乃離寄戊而土氣孕於離也說經六遍髮白返黑齒落更生天一生水以地六成之說經七遍老者返壯少者皆强地一一生火以天七成之說經八遍婦人懷妊鳥獸含胎已生未生皆得生成天三生木以地八成之歸東處震為砂乃民震合而木成於水砂者汞感鉛氣而結說經九遍地藏發泄金玉露形地四生金以天九成之還西兊方為金乃坤兊合而金成於土蓋汞歸土釜而成寶也說經十遍枯骨更生皆起成人是時一國是男是女莫不傾心皆受護度咸得長生天五生土以地十成之玄師曰天尊十遍說經五行生成之道先五行生數後五行成數十轉回靈之道也明其道則長生用其道則證此十瑞大功重玄章道言是時元始天尊覆述天尊周回說經以召十方之事重顯指其方所次序說經一遍震文東方無極無量品至真大神無鞅之衆浮空而至太安堂鄉納善世界說經二遍離文南方無極無量品至真大神無鞅之衆浮空而至宛梨城境棄賢世界一云宛梨一作宛利說經三遍兊文西方無極無量品至真大神無鞅之衆浮空而至福堂洲咸行世界說經四遍坎文北方無極無量品至真大神無鞅之衆浮空而至鬱單野清淨世界說經五遍艮文東北無極無量品至真大神無鞅之衆浮空而至福集鄉長安世界說經六遍巽文東南無極無量品至真大神無鞅之衆浮空而至元福田用賢世界說經七遍坤文西南無極無量品至真大神無鞅之衆浮空而至延福鄉仁靜世界說經八遍乾文西北無極無量品至真大神無鞅之衆浮空而至福德野延賢世界說經九遍戌下亥上上方無極無量品至真大神無鞅之衆浮空而至諸天宫闕說經十遍辰上巳下下方無極無量品至真大神無鞅之衆浮空而至洞淵九壘正行遊梵四音三十六宫大地官府北酆諸宫十遍周竟十方無極天真大神一時同至一國男女傾心歸仰來者有如細雨密霧無鞅之衆迮國一半土皆偏陷非可禁止於是元始懸一寶珠雙手掐玉清文大如黍米在空玄之中去地五丈玄師曰天尊施玄妙大化懸一寶珠在空玄之中莫測所懸之系黍米者馨香五穀之長去地五丈者離於五欲五塵五聚五色五香五聲出五濁世在五行數外故能入空玄之妙薛幽棲注寶珠者喻道也亦同玄珠之義黍米者五穀之長為生人之本言人之得經如命之資米五濁既出自無衆患五行不用永離相刻自然長生久視得道成真元始登引天真大神上聖高尊妙行真人十方無極至真大神無鞅數衆俱入寶珠之中天人仰看唯見勃勃從珠口中入既入珠口不知所在天真上聖妙行至真氣合道妙體合道真故能隨夭尊登引入空玄黍珠之中天人體未合真不能同入仰看而已且下格小仙有芥子納須彌之妙懸壼天地之境何況大聖天尊敷宣大教示現神變也以至道言之一國者一身之比傾陷者道有傾迮未全一體難稱玄重之妙天人則萬神也天真大神上聖高尊妙行真人則三元之神也夭尊則自己元神一身之主也以內景妙道言之乃玉清寶珠神仙胎化之訣國人廓散地還平正無復欹陷元始即於寶珠之內說經都竟衆真監度以授於我元始說經於寶珠之中衆聖俱入此時只度道君一人道君受得此經故云以授於我我即道君自稱也當此之時喜慶難言法事粗悉諸天復位倏欻之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心不殺不害除身業罪不嫉不妬除心業罪不淫不盜除身業罪不貪不欲除心業罪不憎不𡜍言無華綺口無惡聲復除心業罪也此十二大戒凡修誦此經先須受持齊同慈愛異骨成親國安民豐欣樂太平演梵章經始出教一國以道預有至心宗奉禮敬皆得度世雙手玉清文至此放宣祕章道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世之常辭上聖章上聖已成上聖洞合道妙功德已成真人通玄究微能悉其章誦之十過十遍為一過百遍為十過誦經當以十過為法諸天遙唱萬帝設禮河海靜默山嶽藏雲無出入息也日月停景目不瞬也璇璣不行脉不息也此亦大定之法羣魔束形鬼精滅爽上清文玄師曰酆都六洞內外一十二宫魔王乃魔靈又曰羣魔此魔壞人善性附人惡事干試學人世有禽畜五行精物化為鬼魔此輩分形異類神同於人又有外道妖魔及精靈苦爽之鬼化天尊神仙真人惑亂善人道士明詳勿失墜入此流中回尸起死白骨成人玄師曰真人能通玄究微曉達經內大洞祕諱獲十品感應功德此真人之格也至學章至學之士心堅於金石操烈於水火天地不能逾鬼神不能惑行人之所不能行以有若無此太極以下有仙名者誦之十過則五帝侍衛三界稽首魔精喪眼鬼妖滅爽上清文濟度垂死絶而得生玄師曰至人學士誦之獲六品功德所以爾者學士穢氣未消體未洞真召制十方玉清文威未制天政天政謂日月五星天文七政德可伏御地祇束縛魔靈玉清文但却死而已不能更生學士骨體未真穢氣仍在不能威制天象止獲三品功德此至士之格也勸道章輕誦此章身則被殃不齊戒沐浴行香誦者獲被殃之罪供養尊禮門户興隆世世昌熾與善因緣萬灾不干神明護門玉清文供養尊禮獲五品善果讚玄章斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝修誦章道言凡誦是經十過凡誦者則不限高下之格是能依法精心誦持十過者諸天齊到億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年三元品戒朱陵度人之格有五等九年者中福之格大福則三年小福則二十四年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也玄師曰師受有經之者不以修持止誦經十過致此玄應此言自身功德果報度萬祖苦爽上升朱宫依朱陵品格九年受化更生得為貴人若夙靈通達不昧其本而能好學至經自身功德滿日飛升上清之天遊宴大羅玉京也此凡誦十過之格也上學章上學之士聞道勤行見法必學始終不替寒暑無虧此太清九宫已下有仙名者修誦是經內修其道外誦是經皆即受度飛升南宫玄師曰上學之士亦修亦誦不能度於萬祖止得自身受度此上士之格也世人受誦世人者常途之人也非出羣之士則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空詣師受經誦之止得延壽尸解此世人之格也從真至此凡有五等則階級差殊也暢微章此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠效盟章上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官前以輕誦殃身後以輕泄殃及九祖玄師曰若輕泄易忽漏慢玄科妄泄非人不依年限而私傳或依年限而不齊或盟受漏祕禁使輕慢不信玄文皆入中科殃及九祖長役鬼官者地府主役鬼之官也五嶽掃山酆都役隸山河疊治此鬼官役也又有驅雷役電天官役也擔沙負石地官役也漣汲溟波水官役也此三官徒役也玄局章侍經五帝玉童玉女二十四人紅杏震文墨黑坎文磨真兊文襪臘離文靈寶中文掐定取五方氣吹營衛神文保護受經者身中文剔訣東方九氣青靈啓道童子青靈玉女南方三氣丹靈啓道童子丹靈玉女西方七氣皓靈啓道童子皓靈玉女北方五氣玄靈啓道童子玄靈玉女中央一氣黃靈啓道童子黃靈玉女各二十四人此五方五老帝君各遣玉童玉女計二百四十人侍衛保護玄師曰此乃五行四季九宫二十四氣之神皆在身中三元章道言正月長齊齊者謂身無雜務心不外馳內外清虛抱元守一終乎此月故曰長齊誦詠是經誦則下聲而誦之詠則朗吟以詠聲為上世亡魂斷地逮役度上南宫玄師曰正月者上元天官會地水二官於上元紫微宫校諸功德名舉遷賞會之月宜度上世祖考亡魂斷諸三徒之役七月長齊誦詠是經身得神仙諸天書名黃籙白簡削死上生七月者中元地官會天水二官於中元陽臺宫校勘功過名慶生中會之月宜度已身諸天書名而得神仙也黃籙者天之金籙也白簡者死籍也所謂金籙上生名白簡削死字也十月長齊誦詠是經為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平十月者下元水官會天地二官諸天諸地諸水真聖仙靈星宿宫曹鬼神主宰普校一切功過善惡於東極天之尾閭泄水之源清泠府中名普校建生大會之月宜為國祝安帝王聖祚及依法安鎮有灾之方則民稱太平矣又法曰正月屬寅寅為鬼道是以拔濟先亡按存思口訣水始生火長生寅水火既濟鍊度死魂玉眸鍊質黃華蕩形七月屬申申為人門是以自度己身按存思口訣火之成數水土長生申此乃成數所以得度十月屬亥亥為天門是以上為帝王安鎮國祚下為臣庶保護太平按存思口訣土之成數木之長生亥木乃祖氣所以為父子也土之成數所以為帝王國主也八節之日誦詠是經得為九宫真人一坎文二坤文三震文四巽文五中文六乾文七兊文八艮文九離文復掐中文八節者四立二至二分日也八方天真朝集校量罪福功過於上元八景宫中至日齊戒本方消禳九州地分四十五日水火兵旱災癘誦詠向其方順宫以建指冬至坎用事立春艮用事春分震用事立夏巽用事夏至離用事立秋坤用事秋分兊用事立冬乾用事周回八宫以應八節惟中宫者已也身在中宫得守於五也故為九宫真人也正是戴九履一左三右七二四為肩六八為足五為吾腹乃上清九元豁落之道也本命之日誦詠是經魂神澄正玉清文萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清玉清文至上清文挑本命之日百神朝身諸天所重此日修誦拘魂制魄保命寧神澄正五臟萬氣集身行道章此章當默念內思依法修存道言行道之日誦經之日也皆當香湯沐浴五香之湯也白芷青木香白檀香沈香甘松取東流水煎湯存思口訣香沐上湯浴下謂焚香沐上以手拂香入鼻想入頂門泥丸次飲水浴下若大沐浴日沐月浴即運日從左目出左太陽上有赤光下注成火合我心火燒身畢次存光芒復日太陽上左停次運月從右目出右太陰上有玉光下注成雨合我腎水如大海中洗浴我身滌去五臟穢濁存玉光復月太陰上右停日月洞照我身如在虛空雲座無有隔礙定念齊心齊戒齊者內齊其心外齊其形戒者內持其志外持其行玄師曰齊者有四一曰心齊二曰常齊三曰清淨齊四曰長齊戒者十二大戒在經無上十戒九真妙戒詳載大法入室東向東為長生之方諸天所尊入室誦經迎而向之存思口訣一謂召十方無鞅之神入於已身曰入室背死向生曰東向一謂入靜室而東向兩說並用內外相應也叩齒三十二通上聞三十二天叩齒以集神叩齒之法左為夭鐘伐鬼靈也右為夭磬集百靈也中為天鼓朝聖真也叩齒擊天鼓也想其聲如鼓上震頂門響徹三十二天心拜三十二過心拜不傾側泥丸九宫也心拜過於形拜形雖不動存心屈伏如身禮也閉目存三十二天自北維起太皇黃曾天由東入南至西每方各有八夭在青霄五色雲內金樓玉殿各見一帝君儼然分明次存自身左耳腦縫出東八天額前出南八天右耳腦縫出西八天腦後出北八天却自皇曾夭為始每念一天名叩齒一通心拜一拜次第二玉完夭周回四方至賈奕夭總三十二拜按大法皇曾夭治在北方亥之西乘西北方奎壁二宿梵氣東向誦經東八天出於左耳腦縫者此皇曾天起自北維也凡誦念當依此圖存習精熟知天所在舉念運心了然分明免致臨時疑回不决閉目靜思存神定志入於玄微妙化之境閉目者收視也收視則神還內觀靜思者心不外馳專思其神也身坐青黃白三色雲氣之中內外蓊冥以舌抵上腭先閉氣十二息存三元正宫中有三氣內徹五臟之間存下元丹田宫白氣升中元絳宫黃氣混合為一存中元黃白氣上升上元泥丸宫青氣混合為一三氣從頂門出外盈一室交絡身形纏映所坐自然蓊冥也玄師曰玄氣青元氣黃始氣白即是三氣也皆從一氣而生今居三氣之中以學人存三守一之道一者氣之母也真常之道也存思口訣青黃白三色之氣乃太上始生之氣玄元始三氣也天地始生三氣凝結所以誦經之士身坐三氣之中青乃東方之氣也故在兆之前黃乃中央之氣也故在兆所坐處白乃西方之氣也故在兆之後何不說紅黑二氣乃水火也天地未生已具此氣夭地始生未形此氣四象既有二氣始明為日月也蓊冥者為已處黃氣之中二氣在外掩映自然蓊冥也有青龍存肝中青氣從眼出噓化為青龍侍于左目是肝候白虎肺中白氣從鼻出呬化為白虎侍于右鼻為肺應朱雀心中赤氣從口出呵化為朱雀導于前舌是心宫玄武腎中黑氣從耳出吹化為玄武立于後耳為腎司左出龜右出蛇獅子脾下出五色獅子呼在坐下一法膽出獅子六隻一雲十二雙列于左右白鶴白鶴自胃從頂出嘻九雙在上羅列羅列于左右前後上下訣曰四方上下之神備至名曰六儀左右法曰左日右月出眉後兩太陽六合之府日月照明存日自左太陽出于左目日紫赤氣九芒存月自右太陰出于右目月黃白氣十芒此自己日月也洞煥室內項生圓象光映十方存日月各雲面九寸輝耀室內光芒灌入鼻口入腦後玉枕宮發九色圓象出項後如虹霓之狀光徹十方如此分明存前三氣四靈獅子白鶴日月圓象一一分明一法日在前月在後東向誦經大明生於東月生於西上日月也存思口訣青龍白虎朱雀玄武四神也獅子地獸在我下者乘我者也比地馬同類之神者也白鶴飛禽在我上者覆我者也龍共類而仙者也四方上下之神備至名曰六儀方見日月之形洞煥室內則水火二象見矣五氣備矣乃通前三氣也此靈寶始生天地之象也密呪章玄師曰有心呪心中神存意祝也有微呪自己可聞其聲也有密呪心言而已口動無聲也密呪曰所謂密者口誦心覺神意洞冥外人不可曉其聲也召仙曹總章呪左手玉清文右手上清文高天之上玉清為主玄罡大魁太玄生府中有帝君靈虛王母法曰凡靈寶洞玄仙官皆屬西元王母內禁靈虛宫玉文金符司治仙禁金童玉女校精辨魔統制伯史法曰伯史乃人身命門中一神名此神專升降三宫互傳人身功過等事上達三天形成司舉傳奏教令蠲灾救苦備衛護道囚縛鬼侮流浪諸天濟生度死解厄摧怪通達紫府十天告命召其所主急急如上清靈寶命元始上帝敕密誦一過布十方氣叩齒九通次存玄元太上道君在虛空中侍衛真靈儼然發爐呪無上玄元太上道君太清文太清金闕後聖玄元上道君玄師曰凡啓奏太清即告五靈玄老君召出身神若關啓上清即告真元教主太上老君若啓奏元始天尊即告太上道君召出臣某身中三五功曹玉清文三天功曹三天自然更生功曹傳言功曹飛香功曹奏事功曹玄妙功曹五帝功曹五帝自然更生功曹傳言功曹飛香功曹奏事功曹玄妙功曹玄師曰三五功曹有二端神化各司靈局有三元五德之神乃太清洞神之所隸也此三天五帝功曹亦非胎化有形之類皆三五自然真氣之所化也此天真道氣召録身中三田五臟正氣而成靈神用功曹有所執之曹局故曰功曹功曹辨冠之幘皂紈單衣絳衣佩劍執簿左右官使者卯文酉文玉清文陰陽通達之神五官舉意之先也使者辨冠之幘絳章單衣皂衣色服佩符執仗侍香金童玉清文陽初清潔之氣傳言玉女玉清文陰本淨謹之靈傳言侍香奏意達誠皆四品之元真也金童玉女玉貌瓊顔寶叉雲髻青服大袖仙帶裙履五帝直符玉清文東方青帝直符南方赤帝直符西方白帝直符北方黑帝直符中央黃帝直符各三十二人亦是五方真氣符合道德之氣所化也五帝直符善惡二容曲腳幞頭錦袍繡衣束帶緑靴懸劍執垛各隨方服色直日香官玉清文是直六十甲子之日三皇子孫也日有三十二人以直芳香之氣散穢召真是效職男女本生六甲之氣所化也直日香官如左右官使者狀各三十二人自玉清文移至丑寅卯辰巳文剔出再歸玉文至几前放玄師曰凡諸百靈非止三十二人但召奏止以四方天數三十二人是一夭有三五功曹各一人左右官使者各一人侍香金童傳言玉女各一人五帝直符各一人直日香官一人每一天計一十二人三十二天統有三百八十四人其諸一人惟功曹是二人乃三天五帝各一人功曹上應一千二百官君下合三萬六千神氣一云皆身中之神唯直日香官乃三十二天各一官下來監察而復上奏關啓所言啓白所祈之事心中欲言也貴在簡當至誠默奏今日吉慶三元八節五臘十直三會之日名曰良日若夭赦甲子庚申與節會元臘同日名曰吉日長齊清堂玄師曰非正月七月十月長齊不得言長齊止言今某日吉慶齊戒清堂行修至經若知三洞中盟之道見行事則言修行至經自非此人即不言無量度人若謂十方幽冥乃可言無量度人常時即言為某事誦經臣及甲乙某人之理也受法籙則稱法位未受法籙則稱奉道弟子臣某今某日吉慶齊戒清堂為某事誦經若為他人則言臣某為某人某事誦經奏述誦經之意㫖轉經受生轉經者十轉回靈之義願所啓上徹徑御無上三十二天元始上帝至尊几前放訣薛幽棲𧥶元始上帝即非元始天尊也夫上帝高尊亦位齊元始故得稱焉是知元始之號非一尊之稱發爐畢次存三十二天之氣如玉霞之輝灌注頂中密呪曰貪羅鬱羅無須流陀太沖太極陰陽抱和出有入無鬼神莫測出死入生變化自然元始混氣玄中之玄上干有頂下洞太淵誦之一遍沈痾自痊鍊魂育魄真陽自全齊戒禮誦萬過飛仙無上密呪萬神綿綿心中心呪重復宣傳貪羅洞盟與道合真玉清上極梵氣氤氲分靈布氣降注臣身形神俱妙變化飛升一如令格統攝萬靈急急如元始上帝律令引氣三十二過存思口訣收三十二天之氣入兆身中想身如元始方始轉經攝行元始事也依前式自皇曾天為始次第依色取氣以鼻吸引入口而咽之東八天黃緑青赤蒼黑碧紫之氣歸肝膽筋脉之間其精化生無英公子紫衣蓮華冠住於肝中南八天白黃緑青赤蒼黑碧色之氣歸心包絡血脉之間其精化生司命君元始狀芙蓉冠住於心中西八天紫白黃緑青赤蒼黑色之氣歸肺臟皮膚之間其精化生白元尊神素衣蓮華冠住於肺中北八天碧紫白黃緑青赤蒼色之氣歸腎臟骨節之間其精化生桃孩君紫衣蓮華冠住於腎中玄師曰靈寶正氣即三十二天正真道氣若不採納此氣內修無功成之基外施無感應之驗空尸行上道下鬼誦靈章徒爾施為並先叩齒九通自夭門入元綱流演圖至宿分步之存各天本色之氣布於兆口中東八天步斗牛女虛危室壁之罡南八天步角亢氏房心尾箕之罡西八天步井鬼柳星張翼軫之罡北八天步奎婁胃昴畢觜參之罡四維梵天不屬正宿中斗罡依色取各天之氣立待感通詳載大法兹舉其略東向誦經誦經之格初一遍從道君前序道言昔於始青夭中誦起至此存思却誦後經本章第二遍即從元始洞玄靈寶本章誦去每令一存思周得十遍每至第十遍却當從前序誦一遍而復祝想也誦此經當周十遍者以遵十回度人之義也自道言昔於始青至東向誦經乃太上玉晨大道君前序太上洞玄靈寶無量度人上品經法卷之一
