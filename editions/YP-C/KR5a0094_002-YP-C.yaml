若龍若蜒蟠曲九道漠漠无極總九陽祖炁之元太上以三九運梵三五乘元合四十二炁以開始靑天元祖炁明東方始靑之元應九陽木王之初故東方得九炁以分天境劫號龍漢次九因重復陽炁開明赤文流光敷落五度開圖丹書太上以三乘五三轉朱英合二十四炁以開南丹天元祖炁明南方丹光之元應三陽火王之初故南方得三炁以分天境劫號赤明次復九因重積中黃化元天緯周躔梵元乘五太上以五五三徊混陽十二合五十二炁以開中黃天元祖炁明中靈黃華之元應五陽土王之初故中央得一十二炁以分天境劫號上皇次九元復因素景肇陽七明煥梵五緯乘天太上以七五三乘合三十六炁以開素靈天元祖炁明西華皓景之元應七陽金王之初故西方得七炁以分天境劫號延康次復九因周竟混化歸本一炁肇明太上以二五乘十三積元陽合三十炁以開北玄天元祖炁明玄冥上景之元應一陽水王之初故北方得五炁以分天境劫號開皇是以五劫旣周昊天成象一炁混道八境流光三積九乘八方開景八帝示形九霄分化故元始天尊命天眞皇人以玉厯紀元洞混化之初劫運流復之本諸天分境結元洞正陽之炁爲玉厯以紀天眞天民劫運功積升退之道明九聖九品之階其諸玄祕别有九品仙籙經具載其詳五劫五炁龍漢始靑之炁靑赤明丹光之炁赤上皇中靈之炁黃延康素華之炁白開皇元陽之炁黑東方玉字眞文龍漢始靑玉厯寶章開九陽天元梵華炁九陽迴妙炁三景散元精碧靄浮靈篆靑林粲淑英超遥玉淸府遼邈蓬萊瀛眞化通无間神風滋萬生南方玉字眞文赤明丹光玉厯寶章開三陽天元梵靈炁浩劫開神運龍文泛赤霞八威奔電激九鳳破兇邪鍊度丹皇室飛昇元始家炎明常繼照靈慶集晨華中央玉字眞文上皇中靈玉厯寶章開五陽天元梵寶炁混黃生一炁感化結眞形上德持柔順含光洞杳冥建中該九極執本統三辰煒燁天端上飛芒曜玉靈西方玉字眞文延康素靈玉厯寶章開七陽天元梵英炁皇老儲靈粹金精曜斗威六天咸馘滅萬寶復幽微爽氣浮高闕寒光藹素輝空同披玉勒華麗九霄飛北方玉字眞文開皇玄上玉厯寶章開一陽天元梵混炁五炁符元妙諸天混太冥辰精飛羽黑玉女散華靑紫策封天寶玄光凛帝庭羣魔欽至化萬國保安甯
