seq: 5
front:
  text: 元始无量度人上品經法卷之五道言此諸天中大梵隱語无量之音舊文字皆廣長一丈天眞皇人昔書其文以爲正音李少微註眞一五牙經曰皇人者不知其得道之始也身長九尺玄毛被體皆長尺餘黃帝時在峨眉山絕陰之下以蒼玉爲屋黃金爲座張華羅之幡然千和之香侍者仙童玉女座賓三人皆稱太淸仙王黃帝再拜問道授以五牙三一之文云有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上仙御註有大功德則上帝魔王高眞信用保舉此人於太上仙王之前道備尅得遊行三界昇入金門玄師曰知中篇之音齋而誦者獲乎八品福報此音无所不辟无所不禳无所不度无所不成天眞自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒羣妖束首鬼精自亡琳琅振響酉文十方肅淸河海靜默山嶽吞煙萬靈振伏招集羣仙天无氛穢地无妖塵冥慧洞淸大量玄玄也亥文玄師曰中篇之音有辟禳度成四種无量威神之力誦之者獲十六品祥應已上正文大梵隱語後序成玄英註此明諸天内音冥通慧照之力冥者幽深不測慧者通照无窮慧能照空故云冥慧高而不極謂之洞煥燿三淸之上謂之洞淸洞者空也淸者淨也无邊无際謂之大量大量之内唯有眞空眞中有精其中有信能生眞聖非有非无常住湛然微妙莫測究竟其理不可尋詳玄中更玄故云大量玄玄也
  hash: sha256:c457ffe27d51ec3854bb38a789c625904296e08c5dac598f38057d8746e09c80
