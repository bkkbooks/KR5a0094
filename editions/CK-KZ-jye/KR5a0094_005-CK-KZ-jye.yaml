  - {type: head, offset: 141, content: 玄應章, id: KR5a0094_CK-KZ-jye_005-h2, level: 1}
body:
  text: 廣生高應覺元洞虛應元九眞化交肇圖文靈運構宗範元都感變總括威招自成綠岑遷景皇道含明天林耀權炁精育魂融羅負立圓英隱旻期巨神色洪綱告甯章炎通泛堅敷澄宗虛象玄華龍陽儛穹微正霄艷淵太凝沖玄關三紐大梵飛空隱覺隆益天倫慶呈神戸纏絡眞元散精淨握明照徊合升遷導騫宴雲靈應騰天剛澤徽控陰唆孤儀貫炁冥素宸洞開微周化幽應澄輝帝臺平遐挹虛恢茂童池結飈臨育麗无散開陽通百六沈芒隱階幽廓冥默眞峯會靈堅丕順道吿命騫林龍安洞變純陽隱玄方本還炁象伏高員神變惠允解鍊靈根赤精純道成號威尊利雲友常億仞中邱鬱成瓊壘謡音慶流受位玉室大憲通幽玄章煥落綱輪廼周幽玄還門菏薩作生招非化久法䏍詎冀農頃赤阜由旬一潤雲合浮沱中曲普明貴虛四光功篤留胃華覺填宥祭爲昭達光天圖皛貢冷寬從鬱充沙曇吝敷肅令蕖澄太冥絳咢四迷北走億遊咼愚羅龍各齎以散洛釆於都審此玄頼完可六魔觀覺鬱繿寅文大明紫靈寅文九神度魂卯文開闢玉眞辰文阿奕煒燁巳文飛天流音寅文輪景帝常卯文都靈四指中文頥臻中指中文豁落中指上文大宥中指中文慶雲啟靈寅至中指中文七曜輝魔恬懀敷榮離文虛无上首巳文天紀彌宸午文四吁育象未文濯曜騰精坎文煥赫洞陽離文浮景玉光坤文九靈謠歌寅文世元紫堂四指上文羅英四指中文散景中指中文曜明玉房中指中文八景總獸卯文韶主攝精中文九都辰文騫鬱坤文飛生上靈兌文密羅淨境寅文馥育巽文空輪戌文灌沃黃華卯文坎文霐運玄明子文神宫午文開廓辰文延宛丹庭亥文大猷浮景子文眞定丑文化元寅文蜒宛卯文素眇申文王梁澄煙亥文蕭峙戌文結隅丑文景羅七纏四指中文秀盤三府四指下文流輝九玄酉文寂然中指上文虛邈中指中文飛華坎文拂軿酉文晨濫錄籍申文太漠由延未文阿丘九度未文六龍坤文儛轅乾文蓊靄酉文浮羅卯文紫精馥淵巳文溟涬太育寅文九機化乾乾文覆形厚德四指上文元河淪精四下指文育英四指中文明陀三指下文景晨眇雲中指上文大隗總監中指中文秀樂禁天坎文紫虛陀邱離文劫量交前酉文碧霞韻梵卯文眇眇遊元大指中文龍變運量大指下文馘絕惡𠎝中指中文恢冠玄漠午文萬度成仙午彈森角儲雲九魂鍊精枳默窺玦浮枚臼𨀛鹿幾楊房碧提酇囘池滇黨負蛟逭謁擕澡章變瑜蘭泮璧壞亢滂野生極中昆淸曜展洞涸寂无眇凝素倚虛羅皇達元靈炎鍍綽堂太霄瑤隅厯遐薦漪周扃加圖披蕘蹊臄觚亶渾都戟芸荼炫井欺持蒲掌維迮儀奕洸琅璀扁縷益但幽微畢雷涓湟寔東赤曜叢稽玉玄演侯栢璖至規鎬正左適婆泥煞靈悲招均疆洎南纏魁靜夷損光混元覺緣道守岑遙綿徴知宣太靈湮漠昺和盧隨哲京常華墟咸堅沙栗鐸黜株會衍求裴卓雲靑府業覩般基洼孩蒙甘翠宇九闌蕭鈎漣興龍汾神關溝淪沈魔豁蠻祈通玄寥亢息无知肆明蟒修吉夕馥壇時𤱶湯長敷昌匪庸謹濟朝康堲寬祕法侈宜廣帝理生衞肇宏人天眞皇人梵炁玄遼天寶自然八合之音主治世會地壘洪澤變災厄難誦詠之者禳辟妖𦍲音祥女鬼也淸靜道炁无不甯也地官奉書百靈畏敬神朱寫文服佩明驗施之於至學不宣於下俗也神雲煥層虛梵羅屯碧霄元始九龍駕皇人按靑軺靈光集萬眞珠影開陽寥出示靈寶篇福德由是招洞玄隱高嚴玉音泛雲璈无量匪得思道海生波濤法義同涓流滋植成嘉苗用以振飢窮教興衞中朝帝尊壽億年太平滅兵刀稽首望玉晨靈華散金毫太極眞人曰太上玉晨大道君居紫微之上七映之天經錄玄文玉妃捧經金童散香太一執巾玉郎侍筵龍吟虎嗥慶雲蒙靄十方天眞大神上聖高尊妙行眞人无極飛天神王三界大魔九天丈人無鞅數眾吟詠玉經歸依太上靈寶妙法昌運流布億劫長存誦經畢叩齒三十六通心拜十方冥目默念咒曰臣某謹誦金書玉經十轉旣周乞發龍軿天神下降役使六丁七祖飛昇我騰上淸叩齒九通嚥液十過心禮三拜默咒曰上皇太眞使我昇靈淸齋澡鍊誦詠金經七玄拔散上朝太虛延年長存刻名玉書叩齒九通念高上神霄玉淸命魔滅罪咒曰福布九玄前罪滅三徒中靈推九宸杪納炁大帝宫五仙擕太一併位重玄空遂隱上淸室洞明帝一房叩齒三通咒曰眞炁正神號曰桃君混合生宫保護命門通仙致炁齊景寶雲七祖同生受福高晨叩齒三通咒曰帝一混九炁太素玉華精寶羽宴玉堂八風扇大明高上乘玉景陵梵履昌齡七化紫房下九混五帝淸體生六色耀金暎流神形咸濯元炁内金書玉皇庭叩齒三通咒曰太上洞明飛景九元結精凝炁化炁變神司命混合散形億分千乘火甲萬騎揚旛俱與太一上造帝仙伯无起非仲成曲文一合我炁再合我神三合我魂四合我魄五合我精六合我身我身六合洞靈啟眞八景虛駕三素浮輪我與帝一俱昇玉宸叩齒三通咒曰重華累枝混合天仙身有道籍世有生根金簡玉符名刊日軒所願卽從天錄詵詵所向如心萬神盈門常存太上帝一泥丸雌雄混合百神纏綿誦經萬遍雲駕來迎擕宴五帝日月九君我得神仙上昇玉庭納官雙手玉淸文搯定叩齒九通咒曰臣誦經已畢向來所出臣某身中三五功曹左右官使者侍香金童傳言玉女五帝直符直日香官各三十二人並還金房玉室无令差互保我長生後召復到一如故事剔訣精思還宫訖叩齒三通上香瞑目密咒曰向來聽經衞經聖眾散壇解席各復所司神風靜默山海肅淸千邪伏匿百靈護形存十方天眞上聖各騰雲上天自東方爲始每方叩齒三通心禮三拜卽以鼻引三色雲炁嚥入五臟想四靈復本位叩齒三通嚥液三過畢復爐咒巳文循至辰文厯寅至丑歸玉淸文搯定至几前放訣仙靈仙官金童使者五帝五嶽神仙眞人三炁正神左右龍虎君天仙地仙五靈香官當令召致十方正炁自然生金液丹碧芝英百靈眾眞交會洞玄靈寶齋堂之所存五色祥光瑞炁與眾眞交遶洞灌臣身令臣學道得道求仙得仙舉家受福天下蒙恩追度則云亡靈超度見在蒙恩十方仙童玉女侍衞香煙存香煙騰空直上關奏臣某向來所啟之言速達徑御无上三十二天元始上帝至尊几前剔訣次舉三聞經聞經已後惟願眾生深入法門皈依信受聞經已後惟願眾生萬罪蠲除善芽增長聞經已後惟願眾生永斷執迷常皈正道次隨誦經意願囘向詳夫三洞寶經乃萬天之聖範結飛玄之炁成雲篆之章義貫浮生文垂永劫故天地待之以分判日月因之而運行鬼神敬之則變通人民奉之乃開泰是故誦之者形陟絳霄聞之者神昇金闕莫不人天仰頼生死依憑爲羣品之津梁作眾生之戸牖不可得而聞之者其爲大乘玄藴乎向來臣某陞入經座看誦元始无量度人上品妙經若干卷並諧圓滿奉爲今辰某祝獻念聖位所祈意旨意者延奉上眞祈求景貺薦亡則稱上祈亡者託化仙鄉其經也莫不開函演奥響徹三天執卷吟篇聲聞九億當願侍香金童結香字於天中典經玉郎進經文於簡上卽使愆消億劫福降今辰存亡希開度之恩動植感生成之賜洎乎悠悠庶類蠢蠢含生齊登六度之舟並上三淸之岸情旨别具宣懺爲上良縁念三淸无上天尊太平護國天尊福生无量天尊長生保命天尊消災度厄天尊紫淸賜福天尊太一救苦天尊十方靈寶天尊寶華圓滿天尊无量不可思議功德出戸咒出陰入陽萬神開張關啟事竟請閉仙房按存思口訣左靑龍右白虎前朱雀後玄武獅子地獸在我下者乘我者也白鶴飛禽在我上者覆我者也四方上下之神備至名曰六儀此羅列于左右前後上下明矣故云靑龍白虎朱雀玄武獅子白鶴羅列爲句左眼爲日右眼爲月日自左太陽出于左目月自右太陰出于右目此左右日月理亦曉然故云左右日月照明爲句若夫道言此二章者大法云前章自元始洞玄至列言上淸爲一章後章自元洞玉厯至辭參高眞爲二章龜山丹皇紫文空洞靈章明註曰此是魔王歌章稱我有洞章正文也或者誤以爲二章是以訛相傳因仍舛謬大失經旨非敢强爲辯訂參諸大法故併得而證之載於我有洞章之後誦者伏幸尋詳訣文指節列具於後各按指節搯剔三淸訣上淸文中指上節玉淸文中指中節亦名上帝訣謂之元始祖炁太淸文中指根紫微訣左手小指從四指背過以中指勾定以大指搯四指第三節中指搯掌心橫文子午斗訣左手大指搯四指根子文次過中指根丑文移上中指中文次過四指中文移上四指上文次過中指上文直上中指尖搯午文剔八坤文二四指上節兌文七四指中節乾文六四指根卦九離文九中指上節中宫五中指中文坎文一中指根宫圖訣巽文四二指上節震文三二指中節艮文八二指根十申五指尖酉五指上文戌五指中文亥五指根二未四指尖子四指根辰午三指尖丑三指根訣巳二指尖辰二指上文卯二指中文寅二指根召五三摩眞兌文四指中帝玉四襪臈離文中指上五靈寶玉淸文中指中二嘿黑坎文中指根童玉女一紅杏靈文二指中訣誦靈書中篇結輪運祕訣按九日導乾起自乾亥觀音寅文二指根菩曇丑文中指根流吟中指中文育臻卯文二指中文慶雲辰文二指上文上門巳文二指尖流玄午文中指尖吁員中指上文詵詵巳文二指尖推前辰文二指上文大千中指上文緣邅午文中指尖自騫未文四指尖法輪申文小指尖運容酉文小指上文自宫四指上文咎通申文小指尖之堂未文四指尖蕭嵎四指上文少都酉文小指上文延由戌文小指中文品首亥文小指根合神子文四指根度仙四指中文導乾亥文小指根上玄戍文小指中文合雲四指中文上天子文四指根瑛鮮丑文中指根保珍寅文二指根自眞卯文二指中文度人玉淸文中指中文
