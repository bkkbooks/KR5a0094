body:
  text: 重刋道藏輯要元始无量度人上品經法卷之一太上三五都功職籙弟子陳椿榮集注萬聖尊崇眾眞欽仰无上可上玄之又玄洞玄靈寶是品秩之名無量度人卽一卷之目諸經所宗故曰上品功用微妙是爲妙經道言酉文上淸玉晨大道君靈寶天尊之言也道君序經故以道言爲首玄師曰凡有道言皆玉晨大道君自序非二章之首昔於始靑天中始靑天玉隆騰勝天也碧落空歌卯文大浮𥠖土離文浮𥠖玉隆天帝内諱也受元始度人无量上品玉晨大道君爲靈寶教主乃元始天尊之弟子太微天帝君之師也受靈寶上品度人之道元始天尊註元始天尊是虛皇之應號也從眞起應則曰證修妙思幽源乃自性獨有洞神經曰妙象無形應感有體眞精之炁化成姿容當說是經周廻十過以召十方元始天尊爲道法宗主當此劫運開圖出教說法傳經先周召十方天眞然後登座法曰元始天尊元自己元神一身之主也始當詣座子至午文挑座者空玄之座言方始當詣其座天眞大神上淸文上元至眞九品之眞御註是出三界無修證无位業之高眞上聖高尊玉淸文中元聖尊九品之聖御註是有修證有位業之上聖妙行眞人太淸文下元仙眞九品眞人御註是无爲无作之眞人皆在玉淸之境出離三界之天也此三號天眞比一身則屬上部八景神炁無鞅數眾乘空而來飛雲丹霄綠輿瓊輪羽蓋垂蔭流精玉光亥文流精玉光是九色圓象又曰日月炁天之靈寶也可以採鍊餌之成眞五色鬱勃酉文洞煥太空七日七夜諸天日月星宿璇璣玉𢖍一時停輪玄師曰旣言日月停輪何以分其七日七夜之數乃天尊妙用神通化機運感之所致此之微妙聖應天尊外化日月不行星宿不運璇璣玉𢖍一時停輪不顯晝夜其實内運主宰功用未嘗暫停故玉晨明七日七夜之數又非人世七日七夜之比以内言之大定神光湛然見玉淸境有七日七夜之功也日月停輪二目不瞬也卽非冥目亦非内視亦非臨目是七日七夜久視停其目瞬照明三部内外洞然其一身炁血朝運於百節經絡陰陽營衞皆係於三部脉息其息乃人之一身璇璣玉衡也四至爲璇璣三部爲玉𢖍旣是璇璣不運日月駐景星宿停輪四至不至則三部不息一身炁血俱不運轉御註兀然泰定與神炁合也大定神光四星爲璇璣三星爲玉𢖍璇璣玉𢖍之圖一吸二至一呼一吸四至共得六寸一呼二至一呼二至一吸二至各得三寸一至得十五分經緯天地縱橫十五故上帝付黃帝河圖也靈寶内象丹旨曰人之一炁往來者呼吸是也夫人一呼一吸而爲一息一息之間則分陰陽呼而明爲陽爲晝吸而晦爲陰爲夜七竅之呼七日也七竅之吸七夜也天機不動神凝目住脉定心停故曰七日七夜日月星宿璇璣玉𢖍一時停輪也神風靜默無吹噓出入之息山海藏雲子文无蔽明妄想之業天无浮翳淸明湛寂也四炁朗淸卯文自然温凉寒燠也一國地土猶一身也山川林木猶四肢百脉毛髮孔竅營衞骨節也緬平一等无復高下士皆作碧玉无有異色入於道定之境湛然體性一身内外皆如碧玉无一毫之塵也玄師曰定觀七日不知晝夜觀心无心乃是眞元之心觀形无形乃識本始眞形心形都无自入无形之道此乃大定神光湛然見玉淸境有七日七夜之功也眾眞侍座玉淸文天尊以大法而感召十方天眞則隨感而咸集亦猶收神氣海藏息丹田則三萬六千神官自侍左右元始天尊玄坐空浮五色獅子之上午文玄師曰天尊空浮乃自已元神居玉淸宫玄坐者法身所御也獅子者元始威神也是五炁朝絳宫威神之妙化結成獅子天尊乘之下入丹田左靑右白前赤後黑中黃故有五色獅子之象因成五行說經一遍諸天大聖同時稱善是時一國男女聾病耳皆開聰天一生水也乃坎之炁孕於乾金諸天大聖同時稱善者萬神一時俱暢一國男女者法身陰陽二炁聾病者坎爲耳故屬之玄師曰至道言之迷音不知音外眞病耳不聽无聲大聰亦聾御註何謂之聾以耳无聽德之善故也一聞天尊說法則天耳開聰法音流響洞然无礙也餘同此說說經二遍盲者目明地二生火也乃離之炁孕於巽木離爲目目應心心昧於物暗而若盲依道而行心開意悟物莫能蔽邪說經三遍喑者能言天三生木也乃震之炁孕於艮水艮爲山山高土厚水泉出焉說經四遍跛痾積逮皆能起行地四生金也乃兌之炁孕於坤土起行者乃植立之狀木性有焉說經五遍久病痼疾一時復形天五生土也乃離寄戊而土炁孕於離也說經六遍髮白返黑齒落更生天一生水以地六成之說經七遍老者返壯少者皆强地二生火以天七成之說經八遍婦人懷姙鳥獸含胎已生未生皆得生成天三生木以地八成之歸東處震爲砂乃艮震合而木成於水砂者汞感鉛炁而結說經九遍地藏發泄金玉露形地四生金以天九成之還西兌方爲金乃坤兌合而金成於土蓋汞歸土釜而成寶也說經十遍枯骨更生皆起成人是時一國是男是女莫不傾心皆受護度咸得長生天五生土以地十成之玄師曰天尊十遍說經五行生成之道先五行生數後五行成數十轉迴靈之道也明其道則長生用其道則證此十瑞大功道言是時元始天尊覆述天尊周回說經以召十方之事重顯指其方所次序說經一遍震文東方无極无量品至眞大神无鞅之眾浮空而至太安堂鄉納善世界說經二遍離文南方无極无量品至眞大神无鞅之眾浮空而至宛梨城境棄賢世界一云宛梨一作宛利說經三遍兌文西方无極无量品至眞大神无鞅之眾浮空而至福堂洲咸行世界說經四遍坎文北方无極无量品至眞大神無鞅之眾浮空而至鬱單野淸淨世界說經五遍艮文東北无極无量品至眞大神无鞅之眾浮空而至福集鄉長安世界說經六遍巽文東南无極无量品至眞大神無鞅之眾浮空而至元福田用賢世界說經七遍坤文西南无極无量品至眞大神无鞅之眾浮空而至延福鄉仁靜世界說經八遍乾文西北无極无量品至眞大神无鞅之眾浮空而至福德野延賢世界說經九遍戌下亥上上方无極无量品至眞大神无鞅之眾浮空而至諸天宫闕說經十遍辰上巳下下方无極无量品至眞大神无鞅之眾浮空而至洞淵九壘正行遊梵四音三十六宫大地官府北酆諸宫十遍周竟十方无極天眞大神一時同至一國男女傾心歸仰來者有如細雨密霧无鞅之眾迮國一半土皆偏陷非可禁止於是元始懸一寶珠雙手掐玉淸文大如黍米在空玄之中去地五丈玄師曰天尊施玄妙大化懸一寶珠在空玄之中莫測所懸之系黍米者馨香五穀之長去地五丈者離於五欲五塵五聚五色五香五聲出五濁世在五行數外故能入空玄之妙薛幽棲註寶珠者喻道也亦同玄珠之義黍米者五穀之長爲生人之本言人之得經如命之資米五濁旣出自無眾患五行不用永離相刻自然長生久視得道成眞元始登引天眞大神上聖高尊妙行眞人十方无極至眞大神无鞅數眾俱入寶珠之中天人仰看唯見勃勃從珠口中入旣入珠口不知所在天眞上聖妙行至眞炁合道妙體合道眞故能隨天尊登引入空玄黍珠之中天人體未合眞不能同入仰看而已且下格小仙有芥子納須彌之妙懸壺天地之境何况大聖天尊敷宣大教示現神變也以至道言之一國者一身之比傾䧟者道有傾迮未全一體難稱玄重之妙天人則萬神也天眞大神上聖高尊妙行眞人則三元之神也天尊則自己元神一身之主也以内景妙道言之乃玉淸寶珠神仙胎化之訣國人廓散地還平正无復欹䧟元始卽於寶珠之内說經都竟眾眞監度以授於我元始說經於寶珠之中眾聖俱入此時只度道君一人道君受得此經故云以授於我我卽道君自稱也當此之時喜慶難言法事粗悉諸天復位倏欻之間寂無遺響是時天人遇值經法普得濟度全其本年无有中傷傾土歸仰咸行善心不殺不害除身業罪不嫉不妬除心業罪不婬不盗除身業罪不貪不欲除心業罪不憎不𡜍言無華綺口无惡聲復除心業罪也此十二大戒凡修誦此經先須受持齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世雙手玉淸文至此放道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是魔王内諱百靈之隱名也非世之常辭上聖已成上聖洞合道妙功德已成眞人通玄究微能悉其章誦之十過十遍爲一過百遍爲十過誦經當以十過爲法諸天遙唱萬帝設禮河海靜默山嶽藏雲无出入息也日月停景目不瞬也璇璣不行脉不息也此亦大定之法羣魔束形鬼精滅爽上淸文玄師曰酆都六洞内外一十二宫魔王乃魔靈又曰羣魔此魔壞人善性附人惡事干試學人世有禽畜五行精物化爲鬼魔此輩分形異類神同於人又有外道妖魔及精靈苦爽之鬼化天尊神仙眞人惑亂善人道士明詳勿失墜入此流中迴尸起死白骨成人玄師曰眞人能通玄究微曉達經内大洞祕諱獲十品感應功德此眞人之格也至學之士心堅於金石操烈於水火天地不能逾鬼神不能惑行人之所不能行以有若无此太極以下有仙名者誦之十過則五帝侍衞三界稽首魔精喪眼鬼妖滅爽上淸文濟度垂死絕而得生玄師曰至人學士誦之獲六品功德所以爾者學士穢炁未消體未洞眞召制十方玉淸文威未制天政天政謂日月五星天文七政德可伏御地祇束縛魔靈玉淸文但郤死而已不能更生學士骨體未眞穢炁仍在不能威制天象止獲三品功德此至士之格也輕誦此章身則被殃不齋戒沐浴行香誦者獲被殃之罪供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門玉淸文供養尊禮獲五品善果斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過凡誦者則不限高下之格是能依法精心誦持十過者諸天齊到億曾萬祖幽魂苦爽皆卽受度上昇朱宫格皆九年三元品戒朱陵度人之格有五等九年者中福之格大福則三年小福則二十四年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也玄師曰師受有經之者不以修持止誦經十過致此玄應此言自身功德果報度萬祖苦爽上昇朱宫依朱陵品格九年受化更生得爲貴人若夙靈通達不昧其本而能好學至經自身功德滿日飛昇上淸之天遊宴大羅玉京也此凡誦十過之格也上學之士聞道勤行見法必學始終不替寒暑无虧此太淸九宫已下有仙名者修誦是經内修其道外誦是經皆卽受度飛昇南宫玄師曰上學之士亦修亦誦不能度於萬祖止得自身受度此上士之格也世人受誦世人者常途之人也非出羣之士則延壽長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空詣師受經誦之止得延壽尸解此世人之格也從眞至此凡有五等則階級差殊也此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官前以輕誦殃身後以輕泄殃及九祖玄師曰若輕泄易忽漏慢玄科妄泄非人不依年限而私傳或依年限而不齋或盟受漏祕禁使輕慢不信玄文皆入中科殃及九祖長役鬼官者地府主役鬼之官也五嶽掃山酆都役隸山河疊治此鬼官役也又有驅雷役電天官役也擔沙負石地官役也漣汲溟波水官役也此三官徒役也侍經五帝玉童玉女各二十四人紅杏震文墨黑坎文磨眞兌文襪臘離文靈寶中文掐定取五方炁吹營衞神文保護受經者身中文剔訣東方九炁靑靈啟道童子靑靈玉女南方三炁丹靈啟道童子丹靈玉女西方七炁皓靈啟道童子皓靈玉女北方五炁玄靈啟道童子玄靈玉女中央一炁黃靈啟道童子黃靈玉女各二十四人此五方五老帝君各遣玉童玉女計二百四十人侍衞保護玄師曰此乃五行四季九宫二十四炁之神皆在身中道言正月長齋齋者謂身无雜務心不外馳内外淸虛抱元守一終乎此月故曰長齋誦詠是經誦則下聲而誦之詠則朗吟以詠聲爲上世亡魂斷地逮役度上南宫玄師曰正月者上元天官會地水二官於上元紫微宫校諸功德名舉遷賞會之月宜度上世祖考亡魂斷諸三徒之役七月長齋誦詠是經身得神仙諸天書名黃籙白簡削死上生七月者中元地官會天水二官於中元陽臺宫校勘功過名慶生中會之月宜度己身諸天書名而得神仙也黃籙者天之金籙也白簡者死籍也所謂金籙上生名白簡削死字也十月長齋誦詠是經爲國王帝主君臣父子安鎮國祚保天長存世世不絕常爲人君安鎮其方民稱太平十月者下元水官會天地二官諸天諸地諸水眞聖仙靈星宿宫曹鬼神主宰普校一切功過善惡於東極天之尾閭泄水之源淸冷府中名普校建生大會之月宜爲國祝安帝王聖祚及依法安鎭有災之方則民稱太平矣又法曰正月屬寅寅爲鬼道是以拔濟先亡按存思口訣水始生火長生寅水火旣濟鍊度死魂玉眸鍊質黃華蕩形七月屬申申爲人門是以自度己身按存思口訣火之成數水土長生申此乃成數所以得度十月屬亥亥爲天門是以上爲帝王安鎮國祚下爲臣庶保護太平按存思口訣土之成數木之長生亥木乃祖炁所以爲父子也土之成數所以爲帝王國主也八節之日誦詠是經得爲九宫眞人一坎文二坤文三震文四巽文五中文六乾文七兌文八艮文九離文復搯中文八節者四立二至二分日也八方天眞朝集校量罪福功過於上元八景宫中至日齋戒本方消禳九州地分四十五日水火兵旱災癘誦詠向其方順宫以建指冬至坎用事立春艮用事春分震用事立夏巽用事夏至離用事立秋坤用事秋分兌用事立冬乾用事周廻八宫以應八節爲中宫者已也身在中宫得守於五也故爲九宫眞人也正是戴九履一左三右七二四爲肩六八爲足五爲吾腹乃上淸九元豁落之道也本命之日誦詠是經魂神澄正玉淸文萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸玉淸文至上淸文挑本命之日百神朝身諸天所重此日修誦拘魂制魄保命甯神澄正五臟萬炁集身道言行道之日誦經之日也皆當香湯沐浴五香之湯也白芷靑木香白檀香沈香甘松取東流水煎湯存思口訣香沐上湯浴下謂焚香沐上以手拂香入鼻想入頂門泥丸次飲水浴下若大沐浴日沐月浴卽運日從左目出左太陽上有赤光下注成火合我心火燒身畢次存光芒復日太陽上左停次運月從右目出右太陰上有玉光下注成雨合我腎水如大海中洗浴我身滌去五臟穢濁存玉光復月太陰上右停日月洞照我身如在虛空雲座无有隔礙定念齋心齋戒齋者内齋其心外齋其形戒者内持其志外持其行玄師曰齋者有四一曰心齋二曰常齋三曰淸淨齋四曰長齋戒者十二大戒在經无上十戒九眞妙戒詳載大法入室東向東爲長生之方諸天所尊入室誦經迎而向之存思口訣一謂召十方无鞅之神入於已身曰入室背死向生曰東向一謂入靜室而東向兩說並用内外相應也叩齒三十二通上聞三十二天叩齒以集神叩齒之法左爲天鐘伐鬼靈也右爲天磬集百靈也中爲天鼓朝聖眞也叩齒擊天鼓也想其聲如鼓上震頂門響徹三十二天心拜三十二過心拜不傾側泥丸九宫也心拜過於形拜形雖不動存心屈伏如身禮也閉目存三十二天自北維起太皇黃曾天由東入南至西每方各有八天在靑霄五色雲内金樓玉殿各見一帝君儼然分明次存自身左耳腦縫出東八天額前出南八天右耳腦縫出西八天腦後出北八天郤自皇曾天爲始每念一天名叩齒一通心拜一拜次第二玉完天周迴四方至賈奕天總三十二拜按大法皇曾天治在北方亥之西乘西北方奎壁二宿梵炁東向誦經東八天出於左耳腦縫者此皇曾天起自北維也凡誦念當依此圖存習精熟知天所在舉念運心了然分明免致臨時疑囘不决閉目靜思存神定志入於玄微妙化之境閉目者收視也收視則神還内觀靜思者心不外馳專思其神也身坐靑黃白三色雲炁之中内外蓊冥以舌抵上腭先閉炁十二息存三元正宫中有三炁内徹五臟之間存下元丹田宫白炁昇中元絳宫黃炁混合爲一存中元黃白炁上昇上元泥丸宫靑炁混合爲一三炁從頂門出外盈一室交絡身形纏映所坐自然蓊冥也玄師曰玄炁靑元炁黃始炁白卽是三炁也皆從一炁而生今居三炁之中以學人存三守一之道一者炁之母也眞常之道也存思口訣靑黃白三色之炁乃太上始生之炁玄元始三炁也天地始生三炁凝結所以誦經之士身坐三炁之中靑乃東方之炁也故在兆之前黃乃中央之炁也故在兆所坐處白乃西方之炁也故在兆之後何不說紅黑二炁乃水火也天地未生已具此炁天地始生未形此炁四象旣有二炁始明爲日月也蓊冥者爲已處黃炁之中二炁在外掩映自然蓊冥也有靑龍存肝中靑炁從眼出噓化爲靑龍侍于左目是肝候白虎肺中白炁從鼻出呬化爲白虎侍于右鼻爲肺應朱雀心中赤炁從口出呵化爲朱雀導于前舌是心宫玄武腎中黑炁從耳出吹化爲玄武立于後耳爲腎司左出龜右出蛇獅子脾下出五色獅子呼在坐下一法膽出獅子六隻一云十二隻列于左右白鶴白鶴自胃從頂出嘻九隻在上羅列羅列於左右前後上下訣曰四方上下之神備至名曰六儀左右法曰左日右月出眉後兩太陽六合之府日月照明存日自左太陽出于左目日紫赤炁九芒存月自右太陰出于右目月黃白炁十芒此自己日月也洞煥室内項生圓象光映十方存日月各去面九寸輝耀室内光芒灌入鼻口入腦後玉枕宫發九色圓象出項後如虹霓之狀光徹十方如此分明存前三炁四靈獅子白鶴日月圓象一一分明一法日在前月在後東向誦經大明生於東月生於西此天上日月也右月出於右目自右太陰黃白炁十芒白虎鼻出從自肺呬存思之圖左日自左太陽出于左目紫赤炁九芒靑龍目肝從眼出噓存思口訣靑龍白虎朱雀玄武四神也獅子地獸在我下者乘我者也比地馬同類之神者也白鶴飛禽在我上者覆我者也龍共類而仙者也四方上下之神備至名曰六儀方見日月之形洞煥室内則水火二象見矣五炁備矣乃通前三炁也此靈寶始生天地之象也玄師曰有心咒心中神存意祝也有微咒自己可聞其聲也有密咒心言而已口動无聲也密咒曰所謂密者口誦心覺神意洞冥外人不可曉其聲也高天之上玉淸爲主玄罡大魁太玄生府中有帝君靈虛王母法曰凡靈寶洞玄仙官皆屬西元王母内禁靈虛宫玉文金符司治仙禁金童玉女校精辨魔統制伯史法曰伯史乃人身命門中一神名此神專昇降三官互傳人身功過等事上達三天形成司舉傳奏教令蠲災救苦備衞護道囚縛鬼侮流浪諸天濟生度死解厄摧怪通達紫府十天告命召其所主急急如上淸靈寶命元始上帝勅密誦一遍布十方炁叩齒九通次存玄元太上道君在虛空中侍衞眞靈儼然无上玄元太上道君太淸文太淸金闕後聖玄元上道君玄師曰凡啟奏太淸卽告五靈玄老君召出身神若關啟上淸卽告眞元教主太上老君若啟奏元始天尊卽告太上道君召出臣某身中三五功曹玉淸文三天功曹三天自然更生功曹傳言功曹飛香功曹奏事功曹玄妙功曹五帝功曹五帝自然更生功曹傳言功曹飛香功曹奏事功曹玄妙功曹玄師曰三五功曹有二端神化各司靈局有三元五德之神乃太淸洞神之所隸也此三天五帝功曹亦非胎化有形之類皆三五自然眞炁之所化也此天眞道炁召錄身中三田五臟正炁而成靈神用功曹有所執之曹局故曰功曹功曹弁冠之幘皂紈單衣絳衣佩劍執簿左右官使者卯文酉文玉淸文陰陽通達之神五官舉意之先也使者弁冠之幘絳章單衣皂衣色服佩符執仗侍香金童玉淸文陽初淸潔之炁傳言玉女玉淸文陰本淨謹之靈傳言侍香奏意達誠皆四品之元眞也金童玉女玉貌瓊顏寶釵雲髻靑服大袖仙帶裙履五帝直符玉淸文東方靑帝直符南方赤帝直符西方白帝直符北方黑帝直符中央黃帝直符各三十二人亦是五方眞炁符合道德之炁所化也五帝直符善惡二容曲脚幞頭錦袍繡衣束帶綠靴懸劒執垛各隨方服色直日香官玉淸文是直六十甲子之日三皇子孫也日有三十二人以直芳香之炁散穢召眞是效職男女本生六甲之炁所化也直日香官如左右官使者狀各三十二人自玉淸文移至丑寅卯辰巳文剔出再歸玉文至几前放玄師曰凡諸百靈非止三十二人但召奏止以四方天數三十二人是一天有三五功曹各一人左右官使者各一人侍香金童傳言玉女各一人五帝直符各一人直日香官一人每一天計一十二人三十二天統有三百八十四人其諸一人惟功曹是二人乃三天五帝各一人功曹上應一千二百官君下合三萬六千神炁一云皆身中之神唯直日香官乃三十二天各一官下來監察而復上奏關啟所言啟白所祈之事心中欲言也貴在簡當至誠默奏今日吉慶三元八節五臘十直三會之日名曰良日若天赦甲子庚申與節會元臘同日名曰吉日長齋淸堂玄師曰非正月七月十月長齋不得言長齋止言今某日吉慶齋戒淸堂行修至經若知三洞中盟之道見行事則言修行至經自非此人卽不言无量度人若謂十方幽冥乃可言无量度人常時卽言爲某事誦經臣及甲乙某人之理也受法籙則稱法位未受法籙則稱奉道弟子臣某今某日吉慶齋戒淸堂爲某事誦經若爲他人則言臣某爲某人某事誦經奏述誦經之意旨轉經受生轉經者十轉迴靈之義願所啟上徹逕御无上三十二天元始上帝至尊几前放訣薛幽棲註元始上帝卽非元始天尊也夫上帝高尊亦位齊元始故得稱焉是知元始之號非一尊之稱發爐畢次存三十二天之炁如玉霞之輝灌注頂中密咒曰貪羅鬱羅無須流陀太沖太極陰陽抱和出有入无鬼神莫測出死入生變化自然元始混炁玄中之玄上干有頂下洞太淵誦之一遍沈痾自痊鍊魂育魄眞陽自全齋戒禮誦萬過飛仙无上密咒萬神綿綿心中心咒重復宣傳貪羅洞盟與道合眞玉淸上極梵炁氤氲分靈布炁降注臣身形神俱妙變化飛昇一如令格統攝萬靈急急如元始上帝律令存思口訣收三十二天之炁入兆身中想身如元始方始轉經攝行元始事也依前式自皇曾天爲始次第依色取炁以鼻吸引入口而嚥之黃綠靑赤蒼黑碧紫色之炁歸肝膽筋脉之間其精化生无英公子紫衣蓮華冠住於肝中白黃綠靑赤蒼黑碧色之炁歸心包絡血脉之間其精化生司命君元始狀芙蓉冠住於心中紫白黃綠靑赤蒼黑色之炁歸肺臟皮膚之間其精化生白元尊神素衣蓮花冠住於肺中碧紫白黃綠靑赤蒼色之炁歸腎臟骨節之間其精化生桃孩君紫衣蓮華冠住於腎中玄師曰靈寶正炁卽三十二天正眞道炁若不採納此炁内修无功成之基外施无感應之驗空尸行上道下鬼誦靈章徒爾施爲並先叩齒九通自天門入元綱流演圖至宿分步之存各天本色之炁布於兆口中東八天步斗牛女虛危室壁之罡南八天步角亢氐房心尾箕之罡西八天步井鬼柳星張翼軫之罡北八天步奎婁胃昴畢觜參之罡四維梵天不屬正宿中斗罡依色取各天之炁立待感通詳載大法兹舉其畧誦經之格初一遍從道君前序道言昔於始靑天中誦起至此存思郤誦後經本章第二遍卽從元始洞玄靈寶本章誦去每令一存思周得十遍每至第十遍郤當從前序誦一遍而復祝想也誦此經當周十遍者以遵十迴度人之義也自道言昔於始靑至東向誦經乃太上玉晨大道君前序
