front:
  text: 謹按靈寳經法秋一凡九品陰功及消禳災害并自用祈福度厄行功存身爲元始天尊坐空浮五色獅子之上居日光中
  hash: sha256:a6ca4abc075576afccfdd45fcfd6d8a11f428bf94efcb57a2b6dbc2b882ad69c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0094_SJB_000-020469b, image: sjb/02/020469b.png}
body:
  text: 天地父母國王及天象可以神誦上丹田神誦四千遍爲灾厄及他人可以心誦中丹田心誦三千遍爲一切亡殁幽魂可以炁誦下丹田炁誦三千遍每一存思須得十遍十遍爲一過百遍爲十過十言一叩齒以召神百言一嚥津以和炁錯一宇却前三十字以誦之越一字再覆五十字以誦之誦則下聲而誦之詠則朗吟以詠聲使音句周竟勿令匆速苟貪遍數常令神魂悅暢香炁綿綿不絶於室若以音聲華美急逐遍數亦無靈感空尸誦經欲飛返沈非徒无益亦招輕誦之愆玉几仙降筆混淪未判中存得一之靈大塊既分内抱生三之寳散而爲炁聚則成文彌綸空洞之中羅絡虛玄之表元綱流演立天地之精根萬範開張布陰陽之血脉五文普植三景齊明
  hash: sha256:3a0705e07b9c332b5eae5e6e828f34acd56fb8a4f4756671143e78a71d1937a1
