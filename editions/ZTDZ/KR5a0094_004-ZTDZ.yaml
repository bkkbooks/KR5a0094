body:
  text: 太上三五都功職籙弟子陳椿榮集註普度章道言夫天地運度亦有否終運是劫運度是度數成玄英註否終者否是陽九百六終謂三界消亡陽九百六者按周易大衍十九年爲一章四章爲一部二十部爲一統三統爲一元一元四千六百二十年其中通有五十四年水旱陽九者陽數奇極於九災應之時大則九年之旱也其次則七年五年三年一年之火也陰數偶極於八灾應之時則八年六年四年二年之水百六初入元一百六十年陽數奇有小旱之災故云百六之災通論陽九百六之會者初入元三百年爲小陽九小百六九百年爲大陽九大百六大則大旱九年大水八年也漢書云四千六百一十七年爲一元數盡三元爲大劫之終天地消亡也三元合一萬三千八百五十一年初入元一百六十年爲一小災故云百六否終之義略舉如前也日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災同炁皆當齊心修齋六時行香十遍轉經福德立降消諸不祥无量之文普度无窮玄師曰六時者半夜平旦食時日中晡時黄昏六陽時也陰鍊章道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度尸形如法依五鍊生尸之法以度尸形其鍊度尸形之法出靈寳五鍊生尸經九鍊生化章魂神逕上南宫隨其學功計日而得更生轉輪不滅便得神仙保鎮章道言夫天地運終亦當修齋修靈寳金籙齋行香誦經星宿錯度日月失昏亦當修齋修天皇九曜齋行香誦經四時失度陰陽不調亦當修齋修五帝育物齋行香誦經請雨祈晴修洞淵五神齋國主有災兵革四興亦當修齋修太一聖眞齋行香誦經疫毒流行兆民死傷亦當修齋修長生保命齋行香誦經師友命過亦當修齋修靈寳黄籙齋行香誦經玄師曰所立齋法世並有科此六條正是學士修誦大法功行之要道凡遇一切厄會當修齋行香誦經必獲眞人之位所謂得爲金闕臣也詳見大法夫齋戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人當默運慈心普及一切悉爲禳厄解難以陰修善功也至言章道言凡有是經能爲天地帝主兆民行是功德有灾之日發心修齋燒香誦經十過皆諸天記名萬神侍衛修齋誦者獲三品善果右别至人剋得爲聖君金闕之臣諸天記人功過毫分无失天中魔王亦保舉爾身得道者乃當洞明至言也誦此經當周十遍體元始說經周迴之意未通經中深義不得懈怠退志功成之後心府虚靜塵穢不侵自然通達眞旨自道言此二章至洞明至言也太上玉晨大道君後序大洞章諸天中大梵隱語无量音此是題目也嚴東曰隱者有四一隱名二隱諱三隱事四隱語也李少微曰按内音經云元始天尊於赤明世界栢陵舍座是時雲霧鬱勃三日三夜玄陰不解五老上白天尊曰今日侍座所未曾見夭尊演教則河海靜默山嶽藏煙今日晝陰天人惶懼不審何故天尊告曰今日諸天發瑞靈應自然玉字煥爛障蔽天光咸令四座暝目伏聽俄頃天炁頓啓冥暗消豁五色光明洞照十方忽有靈書宇方一丈於空玄之上文彩爛煥八角垂芒精光亂目不可得看天尊普告曰此靈書八會字无正形其趣宛奥難可尋詳可注筆解之於是夭眞皇人受天尊明命注解其音分其分度三十二天天各八字並飛玄自然之書合五方飛玄之炁以和八字之音名曰大梵隱語无量洞章道君撰太上玉晨大道君爲靈寳教主撰此靈書中篇三十二天玉字成經爲雲篆光明章元始靈書中篇此道君自標於題目之下此正文大梵隱語之音大法中篇是三十二天大梵玉字内音无量隱語之㫖乃元始祖炁靈書中禁之篇玉晨道君所撰天眞皇人所書也内隱大洞祕諱五劫開圖之㫖凡二百五十六言分置三十二天天各八字内按乾坤坎艮震巽離兊八卦支變八八六十四卦一句按一卦也通貫六十甲子乾坤坎離四卦出於六甲之表不在甲子之限李少微曰今所註者一依眞皇人内音訓釋或删繁取要或加字益明回互經文不依輪次者務使人速見其意也東方九炁青天自然玉宇亶樓阿薈丁丑无惒觀音戊寅寅文李少微註此八字皇曾天内音也亶者坦然廣遠貌樓者玉京山下長樓亶遠廣遠上承玄都之宫亦謂之樓都阿者玄都宫阿那之神名主大梵之炁阿那鳴樓都之鼓以集衆眞上朝元始薈者帝君遊臺之名薈蔚華秀无者太无也言太无之中自然生眞也惒者日月門户之名觀者觀覺天中帝君之諱音者八字之音人能誦八字之音則眞人乘金輪以開冥玉女揚華旛以披鈕觀覺主長夜之録四冥拔九幽之府七祖披朗朽骸還生也須延明首已卯法攬菩曇庚辰丑文此八字玉完天内音也須延者玉完天西北闕名也大劫數交須延開而玉眞上聖於是而回明首者元始之都候也元始開運則都候啓道梵炁自朗法者法輪罪福之場攬者攬覺天中帝君之諱菩者菩提曇者曇頤並上元眞人也人能誦此洞章則法輪引籍於司命攬覺度魂於更生菩提執九色之麾以輪運曇頤旋十絶之旛以停椿天地得之則不傾萬物得之以長存稼那阿奕辛巳忽訶流吟壬午中指中文此八字何童天内音也稼那者天中正圖先生之號領人生死圖録總主神仙治金華宫金華宫與龍山連宇煒燁玉清之上蔚勃洞虚之中阿奕者七寳林中樹名也實上聖之遊圃眞人之戲園忽者覺也飛天神王之諱訶者訶摩天中呼元始天尊爲訶摩劫運終則訶摩開化教法普度天人將來劫壊眞經隱藏天尊已知預爲流布歌吟也人能誦此洞章正圖先生則削罪録於長夜注生名於南宫也華都曲麗癸未鮮菩育臻甲申卯文此八字平育天内音也華都者天中太極宫青華門之别名曲者天中有梵天神人飛行太極之上爽靈風之炁歌洞章之曲麗者太和玉女之名鮮者鮮雲即慶雲也菩者天中菩樓也育者天中帝君之隱名臻者至也育帝常乘八景之輪遊觀八極至於鬼神之家回十絶之旛以召魔舉仙人能誦此洞章飛天遥唱三界司迎七祖出夜上昇南宫也答落大梵乙酉散煙慶雲丙戌辰文此八字文舉天内音也答者天中玉闕名也落者宫闕落落然也大者大宥天尊開運之初皆放大赦謂之大宥使三惡道空九幽罷對梵者梵炁能開龍漢之劫散煙者眞人散香於玉闕慶雲者五色備也慶雲接乎紫館飛天舞乎空輪也飛灑玉都丁亥明魔上門戊子巳文此八字魔夷天内音也飛者飛天神人之名也天地改運淪於延康㝠㝠无開飛天啓光於是散輝諸天受炁也灑者龍漢一會倏欻而回也玉者玉眞魔夷天帝之諱主開度幽難都者九幽之酆都也人有善功則玉眞開長夜之户酆都度八難之場明者解八字之義也魔者魔王也上者上帝也門者門下也人能明解八字之義則魔王敬伏上帝育養於始生之神門門下韓君司録度筭於南宫慶流九族生死蒙恩也无行上首己丑回蹠流玄午文此八字越衡天内音也无者上道也言元始之炁開明无上之道行者天元之網紀維羅八極梵炁彌布流行不息也上首者北斗之罪宫也回者轉也蹠者履也劫運之初元始則履空而輪轉布化十方流者流晨之光照長夜之府玄者空也越衡天上玄都之景有空峰之山萬聖之所遊生死之所歸道未備足身應滅度魂升空峰受鍊而更生也阿陀龍羅四象吁員庚寅中指上文此八字濛翳天内音也阿者天中有九折之山連阿栢屬陀者山上之樓上通玉清之炁帝君常乘三素之雲上遊阿丘之嶺下監萬生之罪龍者龍山與阿陀相去九億萬里羅者日月之名玉緯曰上清九天眞人呼日爲濯曜羅言山勢相交日月明於峰山四者四極之宫東華南極西靈北眞也四極眞人主生死命籍象者象輪之車眞人常乘象輦遊行三界校人生死罪録開度學道之人吁者吁育天帝之諱爲南宫度命君主鍊度朽骸員者日中生童主灌津於天人八能誦此洞章則玉名入帝簿生死度南宫四極給自然之羽車七祖歡於福堂也誦畢叩齒九通即臨目存九靈妙炁青玉之光從東方无極玄虛中來良久微誦玉晨君祝東方八天无量音玉晨君祝曰森廓連華闕神尊帝一眞靈虚交日月玄覺照冥津玉關回運數梵炁啓都明麾旛揚洞唱天君秉化輪金華領仙籙鬱帶龍山宫寳秀煥珍景宴戲高上墉霏煙散妙靄陶精養我形飛天觀劫會贊詠元始文太極建青籥晨輝布發生爽耀應穹觀熙怡存玉嬰皇育旋景輿昇度七祖魂彌範流飛綱周維天地根祥霞翳霄仞紫館眞人君軒奕青玄府滅試摧邪兇道應混高元神結泥丸精靈丘三素雲羅耀交琳峯七九齊至用三五合同功併恊冲和德變鍊超仙宗祝畢存前九靈妙炁青雲九重覆帀身形九色玄龍導從左右密呪曰赤明開圖八炁回眞總統元關青帝大神流化九外纏綿我身靈音八書六十四篇洞明天地與我合仙運致龍駕上昇帝轅呪畢引前九靈妙炁九嚥混合五臟如瑠璃映照之色行之九年致青芽九炁之精身生光明徹見虚无萬遍道成即得飛行七祖同福皆昇南宫南方三炁丹天自然玉字南爓洞浮辛卯玉眸詵詵壬辰巳文此八字和陽天内音也南爓者南方有流火之庭飛焰煥乎八方洞浮者洞陽宫炁炎而浮流也玉眸者流火之膏鍊身體則生玉光明如眸子故曰玉眸諸學人始得道者皆詣流火之庭南極眞人以火膏洗鍊蕩除塵垢得與眞人爲侣詵詵然衆多梵形落空癸巳九靈推前甲午辰文此八字恭華天内音也梵形者元始天尊在龍漢時號也至赤明世號无名君上皇開運號元始丈人梵炁化形隨劫化生以一神而見不受胎生故曰梵形落空者元始自空中而生也九靈者九華眞人也理於南上宫中主九幽之下宿對死䰟推前者九華眞人主命録推筭死䰟前生功德有善功者四斗眞人書延生之符而授與之則得拔度九幽也澤𠗂菩臺乙未緑羅大千丙申中指上文此八字宗飄天内音也澤者天中山窟也其山上有衆龍之窟山有黄房之室一名玉容之堂也洛者玉晨道君之内名也理於黄房之内混大劫而不終經龍漢而更明故幽中而悅焉菩者飛夭眞人之隱號有无數之衆臺者玉臺也處於澤山之陽緑羅者月中夫人字羅英容色如玉著緑帔青衣故曰緑羅上乘大羅之天梵行之炁運度之關以應天地之數終於大劫既受交於日月則會於玉臺之上也大千者世界之數陸先生云以千數至千即千千爲小千小千數至千爲中千中千數至千爲大千千中之大故曰大千人能誦詠洞章則得駕羽輪之車昇黄房之室遊玉臺之上覽大千之境也眇莽九醜丁酉韶謡縁邅戊戌午文此八字皇笳天内音也眇者天書玉字淪於延康之中翳而不彰眇眇然也莽者龍漢開運其文復明莽莽然也遇其道男女並皆壽三萬六千歲其運之極又經一劫九炁各生一獸以害惡民其劫既開而九獸號爲九醜之鬼北帝上眞主生死圖籙故立九醜以輔三官數極九九八十一萬度天炁之交九醜當得輔號爲九都使者韶者皇笳夭神霄王之内名神霄王是魔王之神主常試學道之人正與不正魔王作謡歌以亂人心心固者王即保舉徑昇皇笳夭中縁邅者南北二斗君之内諱也人有善功列言於南斗南斗即度三界之難拔九幽之苦告下魔王不敢敗害也人行惡則三官列罪於北斗北斗即告下魔王滅䰟付九幽之下充長夜之役皇笳天上有金華之山學成得道皆詣金華山受太一之信以制滅魔試然後得乘景輪之車遊宴八方九炁者按三天正法經始炁生三炁一曰赤洞二曰白章三曰青浩元炁生三炁一曰緑昺二曰黄景三曰蒼混又曰白遁玄炁生三炁一曰紫融二曰碧炎三曰黑演謂之九炁也雲上九都己亥飛生自騫庚子未文此八字堂曜天内音也雲上飛天神王之諱開龍漢之劫啓赤明之運敷自然之書立天地之根也九都者三象既分而有九層之臺處乎玉京之山煥乎空玄之上飛天神人常散百合之香流五雲之華以觀飛天眞人臺上有太眞玉郎一日三回十絶之旛則諸天上帝三朝玄臺誦詠洞章也飛生南上更生之神名也學士能誦洞章諸天稱慶飛生爲開不死之路流長生之炁下鍊五魂則八景存焉自從也騫者騫林也既共舉人上昇九層玄臺遊於騫林之下身佩天書口誦洞章即得上朝玄都之宫也那育郁馥辛丑摩羅法輪壬寅申文此八字端靖天内音也那者天王侍郎之内名也主天四時之炁梵行虚无之綱以正端靖天中分度也育者天關空輪之名郁馥斗中靈童之名常運育輪於太无之中回十轉以召眞天關十轉則十方大聖上朝玉帝萬神齊到而郁馥唱禮焉摩羅者天中大魔之内諱郁馥一唱魔王束形學者知四時之炁十轉之關則入法輪之門乘八景之輿昇唱玉清之中上朝紫微之臺也霐持无鏡癸卯攬姿運容甲辰酉文此八字恭慶天内音也霐者天中都監神之内名也持者龍淵之名衆龍蟠乎其中御金甖而運東井之華以灌天眞華者日中黄華之精沃注東井之流津无窮之源也无鏡者飛天神王諱也遊乎大羅之上出无色之光度學道之人攬姿者三界之門名人之此號神王則開長夜之府拔九幽之魂以度三界之門也運容者玄和玉女之名人得度三界之門運容則以朱靈之炁導之于形太和之津灌之于神上昇福德之堂保劫運之無窮矣馥朗廓奕己巳神纓自宫丙四指午上文此八字極瑶天内音也馥朗者天中玉京玄臺之别號西靈眞人常誦洞章以遊其上廓奕天中神公之内名與元始同生爲玄炁之範教學仙之人神纓紫微宫靈童也主滅度之尸若得神纓歌无量之章則反形於三鍊之房受自然之炁歡无窮之齡也人能明八字之音則神公爲開長冥之户昇更生之門上登玉京之臺誦畢叩齒三通即臨目存三靈妙炁赤輝之光從南方无極玄虚中來良乆微誦玉晨君祝南方八夭无量音玉晨君祝曰和陽煥明奕炎暉玉鍊顔虚梵隱玄邈空朗昭神功九華破幽録四極延生津黄房晨景居綿綿保長存窈窕騰月妃萬界超劫輪混洞翳玉書龍漢明耀晶神文攝六天察制妖魔羣邪試莫我干列名標上清超度五苦難逍遥玄仞峯飛神開大運明觀九雲重南上鍊我䰟旋蓋遊騫林汎靄纏虚綱十轉回天關大魔咸來賔八景朝紫微龍淵注東井黄華養我眞大羅无色光寂度无窮人朱靈恊至炁太和昇福堂玄臺映鬰蕭誦洞遊西靈神公布玄範反嬰齊自然祝畢存前三靈妙炁絳雲三重覆匝身形朱雀鳳凰翶翔前後密呪曰三炁徘徊靈鳳來飛玉音八宇爛煥紫微吉日大慶我道洞開朱丹哺飴仰吸靈輝身生水火絳帔羽衣登空飛歩足踐鳳梯周旋八天七租相隨呪畢引前三靈妙炁三嚥混合五臟如日輝映照之色行之三年致朱丹三炁之精反白改容萬劫不傾七租超昇上生福堂反胎仙家即得更生西方七炁素天自然玉字刀利禪猷丁未婆泥咎通戊申申文此八字孔昇天内音也刀利者南方无極世界之號襌是刀利之國亦曰襌黎其國有洞陽宫流火庭靈文始於流火受鍊瑩飾光明之後刀利之國改爲福德之堂苦䰟得度入洞陽之宫猷者南上好生君之名婆泥則火鍊池之靈童也咎通是刀利世界魔神也常遏人生路若人知好生君名得度洞陽之宫及詣火池受鍊即更生福德之國則魔神奉焉人能誦八字之音則刀利世界无極靈官侍衛其身徑詣南宫仙人司迎上昇三炁之天也宛藪滌色己酉太眇之堂庚戌未文此八字皇崖天内音也宛藪者皇崖天帝内名也主開度太漠之經以明八字之文明道既彰大羅之上蔚然澄清也滌色者色界上飛天眞人名也乘景雲之車駕九色之龍遊色界之上出入玉清之中蕩除穢炁開度善根之人太眇之堂者化生堂也空洞之化結自然之章坦然廣大開度萬生曆也學人通八字之音則飛天眞人降景雲之車載兆上昇化生之堂也流羅梵萌辛亥景蔚蕭嵎壬四指子上文此八字極風天内音也流者極風天帝諱也處乎紫霄之上遊觀玉京之山羅者月女之諱主王遊宴之儀流輝極風之天洞照九玄之眞也梵者飛天眞人名也主回九天之關萌者元始天神也固極風之根景者景皇四極上眞人也蔚者蔚秀景霄仙人也並理玉京臺歷校長夜之中開度善根之魂蕭者蕭仞白素元君之宫也嵎者蕭仞之嵎對賓之所也人能常誦洞章乃得駕九色之霄上昇景皇之臺矣易邈无寂癸丑宛首少都甲寅酉文此八字孝芒夭内音也易邈者始皇孝芒天中天王之諱无者虚无寂者寂寂是虚无寂寂之庭也言此天王從龍漢而來至赤明而出居乎虚无之内處乎寂寂之庭也宛首太上道君之内號駕八景玉輿策三素飛雲開元始玄奥演大法以度人少都者日中靈童名也散日精以灌眞流飛華以拂塵學人知八字之音則天王飛景雲之輿降三素之軿度身三界之上進入寂寂之庭也阿濫郁竺乙卯華漠延由丙辰戌文此八字翁重天内音也阿濫者翁重天帝諱也乘景霄之輪遊九層之臺處玉樓之上唱洞章以伏魔王郁者郁默天中魔王隱名也竺者欲也是魔王都伯恒在欲界之上誦空謡之歌華者言色界光華也漠者欲界沙漠不可尋也延者束鬼之庭由者禁鬼之防天王詠无量之章則天魔應響而束首羣鬼請由而伏形奉之者九祖開泰修之者灰骸更生也九開自辯丁巳阿那品首戊午亥文此八字江由天内音也九開者大演之初天地未判輪轉三炁開爲九分九度既明九位乃列陰陽萬品於是而生自然明辯也阿者阿丘江由天帝諱也乘九色之龍駕三素之軿上登龍山之嶺遊觀九玄之中那者那邪飛天神人之隱名也飛行三界歷校長夜之中拔度善人之魂有知八字之音則天王品度兆身入飛天之衆首化枯骨成童子之顔矣无量扶蓋已未浮羅合神庚申子文此八字阮樂天內音也无量者天中无量大聖之始神也總統飛天神人受其品量而得昇遷扶者更生眞人之内名校長夜之録簡善惡之根蓋者玄中福堂之號也浮者幽夜之魂受眞人開度謂之浮也乘運而歸上昇福堂也羅者大羅也開大千世界召更生之賓詣大羅之天削死三官合者合慶也神者神公也是大羅丞相人能知八字之音與神公合慶受度爲更生之賓故曰合神玉誕長桑辛酉栢空度仙壬四指戌中文此八字曇誓天内音也玉誕者曇誓天玉都名也長桑者夭中騫林亦名桑林覆廕東華之宫棄上有大洞之章紫書玉字煥乎上清下有扶桑之樹上森騫林之叢碧鷄嗚其蓋青霞翠其峰神風流反香之草鼓桑林百籟之音神風一鼓洞章成音故曰栢空也度仙者飛天神人也常以鷄嗚之始登玉臺之上來取五方雲芽仰咽三辰之光簡學仙之人生死録籍開度九幽之䰟昇入法輪之門也誦畢叩齒七通即臨目存七靈妙炁白華之輝從西方无極玄虚中來良久微誦玉晨君祝西方八天无量音玉晨君祝曰洞陽映霄闕受度好生君靈童火鍊攻福館涉生津太漠明道彰眞人翔景雲高清布元化蕩穢除妖氛接我琅碧輿昇入微妙門揚輝浩極家洞耀九玄眞造化回幽關杳眇回靈根景皇連鬱秀檢校超仙魂蕭仞白元子同携列帝賓始皇夭中王寂寂虚无庭玉晨張大範流慶滌我塵穹樓演洞唱收魔束鬼形三元分化祖九度悉宣陳阿丘馳素軿那邪契所縁彌羅大聖神更生陞福筵逸化乘運歸削死永合歡瓊府巍峨境森扶靄華騫雲芽揖三暉享此億遐年祝畢存前七靈妙炁白雲七重映覆身形白虎獅子導引左右密呪曰七炁金靈八天尊神白虎策輦獅子捧轅七炁纏綿鍊我成仙身發金光映照素雲内外變化昇入洞門七祖出夜九幽放魂三徒五苦長斬惡根同歡福會受慶自然億劫開度隨運長存呪畢引前七靈妙炁七嚥混合五臟如月晶映照之色行之七年致太素七炁之精停年留世萬劫童顔慶及七祖昇度南宫反胎更生世世生仙北方五炁玄天自然玉宇玃无自育癸亥九日導乾亥文此八字霄度天内音也玃无是龍漢時飛天之神也元始始開之炁溟涬无色之中玃无乘運而岀凝然而立霄度既立自抗不終之劫育者霄度天王之内名九者育王乘象輪之車遊九玄之門九機之度應劫會之期日者天中日童導者導引和炁天運之終日童停光拔度學者灌以水母之精導以太和之炁洗鍊五神進入朱宫故曰導乾坤母東覆形攝上玄甲子戌文此八字元洞天内音也坤母者太陰之都候九靈之母也理東海扶桑暘谷之淵常總地機轉輪元炁上應天關天關轉地軸動周夭一度水則湧三千三百度夭地炁交九海冥一水則彌天東者東海受會制期河源也履者水神也理於崑崙之山填固巨海遏斷東井則地機不淪保劫長存形攝者灾交之時坤母形出東河之上攝召鳥母以鳳車迎學仙之人上崑崙之墟鳥母乃水之候神也上者坤母上詣帝君申劫會之期度學仙之人言名於玄都之官也陀羅育邈乙丑眇炁合雲丙四指寅中文此八字妙成天内音也陀者天帝之内名與妙成俱生在雲阿之嶺羅是月始生之名陀在雲嶺之上抱月而明育者妙成天神王名育生總統十方飛天之神邈者天中羽林監神名神王常使匡御三界簡人生死之籍令魔王保度得道之人眇者眇眇高遠也人得保度詣羽林受符而昇天眇眇行於雲宫也炁者雲炁也合者合景也既入羽林結雲炁以成衣飛昇朱宫受福天堂遂與諸天合景而上飛也飛天大醜丁卯總監上天戊辰子文此八字禁上天内音也飛天者飛天神王也天上有飛玄之炁結成空洞之經十方神王在空霄之上誦此經以和自然之炁接引學道之人大者三界之都録主生死圖籙醜者伯也是三界之魔王受事於大醜學士識其音則魔王保眞身騰三清也總是飛天都統之官常攝八會之炁以促天地之運監領長夜之官開度九幽之䰟學士知天中之音則天魔列言大醜勒籍仙部而上昇天中也沙陀劫量己巳龍漢瑛鮮庚午丑文此八字常融天内音也沙者天中有沙蘭之宫是紫微之別館處乎玉清之上煥乎紫虚之中陀者陀丘也陀丘之衆有巨萬人皆是新得道受度者也功德未備停散其中劫量者每至劫運一交陀丘之衆計功之量得昇朱陵之宫受福而仙也龍漢者初劫之名是時大道淳朴徒有其化難可爲雜也瑛者龍漢時飛天神名也常開度九幽之䰟昇蘭宫之中鮮者南宫之童學人得度而鮮童鍊其形容於朱陵之上碧落浮黎未辛空歌保珍壬申寅文此八字玉隆天内音也玉隆天中常生碧霞之炁落者飛天神王名也乘碧霞之輦遊玉隆之天一日三時引天中衆聖上朝七寳之宫浮黎者天王内名也衆聖上朝而天王稱慶也空者天中侍晨之名歌者洞章之曲侍晨一嘯靈風既奏音成洞章故曰空歌保珍者學人知八字之音則昇上南宫爲飛天之賔保此不終之劫珍其自然之文故曰保珍惡奕无品癸酉洞妙自眞甲戌卯文此八字梵度天内音也惡奕者天王之内名昔於龍漢之中諸縁並盡而過度三界之庭昇入太虚之館受九仙之籙登大聖之號赤明開運元始錫爲梵度天王无者太无眞人也受天王之符度長夜之䰟品量幽䰟之罪福洞明宿對也宿對既解乃入妙化之堂自者與也眞者天眞也太无眞人度九幽之䰟洞識宿命惡縁並盡度入妙化之堂與飛天而合眞也元梵恢漠乙亥幽寂度人丙子玉清文此八字賈奕天内音也元梵者元始大梵風澤之炁抗舉澄漠之精高而洞浮懸而不落也恢漠者遠而无礙有而若无微而不可名妙而不可尋也幽兮寂兮不可見聞其中有眞其中有精冥度天人也誦畢叩齒五通即臨目存五靈妙炁紫晶之霞從北方无極玄虚中來良久微誦玉晨君祝北方八天无量音玉晨君祝曰開化无上神霄度凝玄炁陽華眞一精太和育妙慧九靈鎮西崑機化停樞會鳳車升羽輪越此大劫津雲阿擁圓皓育生天神君受符羽林宫藹秀靈霞襟空霄飛玄章接舉身超騰天統攝八耀開濟九幽魂蘭宫連紫微按格昇朱陵南宫有妙童琅輝鍊我形蒼霞浮緑輦稱慶拱高尊靈風泛洞響可寳无窮齡九仙頒運籙釋散宿業根流綱抗虚梵廓達歸无名大混百骸紀徊煙合紫雲慶垂七葉孫禍塞三徒源解滯離塵綱齊轡逍遥賓倏忽登龍臺稽首玉帝前祝畢存前五靈妙炁玄雲五重覆布身形飛龜羽蓋蓊鬱前後密呪曰玄天徘徊流景上清大有啓運八字開明飛玄澄空洞陰自生五炁纏綿灌我身形冠帶北單受鍊洞靈腎府仙化内外光精飛行三界遊宴紫庭七祖同慶歡樂劫齡七寳林中反胎更生長夜出離南宫記名黄籙白簡世世生仙呪畢引前五靈妙炁五嚥混合五臟如紫晶映照之色行之五年致靈芝五炁之精還年留景保命三清慶及七祖世世生仙元始无量度人上品經法卷之四
