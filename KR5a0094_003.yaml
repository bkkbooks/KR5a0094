body:
  text: 太上三五都功職籙弟子陳椿榮集注元洞玉曆雙手玉文存神為靈寶真人誦之龍漢延康眇眇億劫李少微注此章論劫運成敗也龜山元録曰元洞上皇氣也天尊結元洞之氣為玉曆之書其曆以龍漢劫為初劫開圖曰赤明劫終曰延康劫循環無窮終而復始劫終之後三界空壞萬物精爽長在太空故曰延康為劫壞之稱赤明是開圖之名二者交周是謂大劫其開皇上皇小劫名也混沌之中上無復色下無復淵風澤洞虛金剛乘天玄師曰此天尊説造道開天之本五劫生成之始也李少微注風澤第八壘氣也風澤之氣堅剛如金故曰金剛亦曰剛風劫盡之時能洞滿虛空承夭不墜按九地內音素靈丹經地下深億萬里得潤澤地其氣黃又二十億萬里得色剛澤地其氣紫又二十億萬里得大風澤地其氣青又下無窮無極無邊無際洞淵綱維地其氣緑皆風梵綱維之故能擎持地輪懸而不落九壘各有四皇合三十六皇九壘三十六地上應三十六天若學者不知天上內音則天帝不領兆名不知地下內音則土皇不奏兆籍終閉而不得仙也地下三十六也天上天下無幽無冥無形無影無極無窮冥涬大梵寥廓無光赤明開圖運度自然玉文坎挑法曰此正經六十四字流化章元始安鎮玉文敷落五篇玉文即五文開廓也第一篇五篇符形載大法明氣發育木精飛英仁惠之氣滋愆萬生天界地綱與時皆正凝耀神鄉結為青書光映萬里號太清九真安化上愛玉符第二篇太丹之氣衍光洞煥飄擲化火融鍊九陰赤字凝章其文甚異敷映九億精明焕天號交神生明玉化之符第三篇黃真之氣結精飛英中央虛落之氣混沌黃元之精交流曆律化感生文光耀萬里光芒熀煜天端之間號真皇混丹肅玄符第四篇素威禁氣流化粹端飄權耀神凝結成書光映萬里其文甚異列明凝芒威摧萬妖號八威禁龍制虎飛英太白玉化之符第五篇玄精發耀萬物滋形生端不竭天曆有紀玉皇上相高觀靈化接摘玄序開明天教册封萬帝玄真感和天文敷炳典約青律天化大成凝結玉章光映九億號明綱玄兆太明九化之符皇人曰五篇者乃元始自然飛英至精虛無混沌之氣凝結而成玉章鎮於大羅之上昔上皇元年星辰交錯惡曜加臨上犯三天曾命真梵真人齎持五篇付於五帝以鎮天元以制夭政又命真如真人齋持五篇付於五嶽以鎮地紀以御地祇又命妙行真人齎持五篇付於名山主者以候成道之士敷揚教法下度生死五篇之氣其功甚博上可以消於天災中可以鎮安國祚下可以度於兆民如召三界五帝建諸壇陛當以土王日青素朱書五篇以敷落五方則萬靈振伏以集羣仙召之即至靡有不從詳載大法兹舉其略赤書玉字八威龍文玉文保制劫運使天長存梵氣彌羅萬範開張玉文挑玄師曰元始祖氣從何先生玉字按靈寶玉字經云自三氣之先溟涬之後其中真精挺生玄氣玄氣之內有神曰元始天王其氣混凝與元始同生流化結芳非色非相或舒或張至延康開劫一氣分形而為二氣虛無自然而生始氣二氣凝結太空彌覆無極字方一丈八角垂芒莫知其理二氣混沌而包藏玉宇至龍漢開劫元始天王分隸二氣混沌開先氣清高澄成天氣降積滯成地二氣分合中有和氣名曰元氣亦曰大梵之氣至赤明劫元始開圖中有真陽之氣化為洞陽之火元始運洞陽之火冶鍊三氣混和玉字而成赤文因而劫號赤明文號赤書玉字是也自三氣成文火鍊為赤書光明之氣陽光之精為日靈光之精成月餘光布散分為萬象三氣之神分為三清之聖自後萬範皆出萬彙皆生莫非玄元始三氣也至開皇劫分隸三氣化生諸聖至上皇劫五劫同啓五行全形化生諸天應五劫之內産生玄中之精精中之神故曰上皇劫自五劫開化之後玉清洞真上清洞玄太清洞神三洞之經四輔符籙皆因赤書玉字而化稟靈寶之氣而成火鍊成文為赤書玉字之後元始命夭真皇人書於其文名八威龍文亦曰諸天八會之書祕於上清玄都金闕七寶瓊臺紫微上宫蘭房金室東西華堂九天太霞之府也升玄章元綱流演三十二天二十八宿訣東七宿自辰上起角亢左行卯上氏房心寅上尾箕挑北七宿自丑上起斗牛子上女虛危亥上室壁挑西七宿自戌上起奎婁酉上胃昴畢申上觜參挑南七宿自未上起井鬼午上柳星張巳上翼軫挑輪轉無色周回十方旋斗歷箕自丑至子文上四指中文過中指中文復至丑文從子歷亥循至寅文挑回度五常金木水火土五星也三十五分日月五星二十八宿是也總氣上元坎兊離震中文斜抹至亥文挑元綱者元氣之綱也明此梵氣演布三十二天輪轉無色之境周匝十方自斗罡左旋經歷箕星回運日月五星二十八宿之分總入上元金闕之門龜山丹皇紫文空洞靈章曰紫氣左回與斗連歷度四七入金門明於元綱流演圖中八景冥合氣入玄玄冥合玉清八景之天氣入玄中之玄大梵天中之天也元綱流演法玄師曰西龜之山一曰龍山言木之道也金母居之言金之體也乃九氣之根紐人之九宫之根也紐黃氣之淵府乃梵氣之宫上之正府也在夭西北亥子之地嬰孩之生根也周回四千萬里是不知其極出常數度量之外也高與玉清連界上通腦也脈通玉帝宫東南接丹陽之霞上承青宫神虎之門接通肺氣也又與大胃交通矣西北交寒穴之野上通金闕神仙之庭與腎宫便穴交氣也南極太丹浮黎之鄉氣協洞陽之光協於心也北指勾陳交關華蓋氣踐廣靈踐中黃宫中央上衝玉京二十四節重樓十二也八達交鋒平夭三十萬里三氣之會也湧金為墻結玉為門真土玉液之闕也金臺玉樓同前議也九宫三田十二神室也上有流精紫闕金華之堂瓊瑶之室傍通五穴即是集五臟之精會門也有自然紫雲之氣交帶鳳文九色落陳四肢八脈五臟六腑赤華紫英五內生氣也崖生紫桂嶺秀瓊林結瑚為條植玉為根騫林含實赤紫白環氣行無庇而生此寶也三華曜葩於朱景返香流芳於太玄內視三明五香生五氣也八氣扇飈以長鼓玉籟空唱而成音內之無器之音也龍嘷雲樓鳳嘯絶嶺毒獸萬羅長蛇千尋神宫堂堂仙靈紛紛巍巍元館觸類吐津蓋元始之妙化實天元之靈根此即大行梵氣周回十方也與東向誦經位次圖向背不同又法曰元綱流演比喻人身與天流演者同人之元氣發自明堂宫右腎命門上為九天之根屬西北乾方紐太淵府黃氣上入於心心屬火絳宫左旋流循腦後風門玉枕宫循入左目日宫右旋下歷東北箕宿足少陰大指流轉一身周回一匝旋轉右肩係無色界纏入右目月宫然後回度五常從三十五分脊骨流入下丹田左腎水宫衝入肝木纏脾土中丹田次過肺金宫從十二重樓喉管通至泥丸宫上丹田囟門靈谷總出上元所謂上通金闕之庭三宫升降上下往來無窮不息蓋人以經絡氣周於一身一日一夜百刻之中呼吸升降計一萬三千五百息大會於風府者也脈屬陰陰行速猶太陰一月一周天息屬陽陽行遲猶太陽一年一周天如人之息脈元氣則應天之常度也陰陽順則流演循度陰陽和則天和脈息和則人和也契玄章玄中太皇上帝高真玄師曰玄中太皇者此西元王母八景玄妙之祖氣亦曰丹皇君乃上帝之道君上皇之聖真泛景太霞嘯詠洞章居西元太霞之府嘯詠空洞靈章以生其萬氣也金真朗郁流響雲營左手執金真玉光右手擲流金火鈴流響三十五天天中雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙玉音攝高上之氣靈風聚辟非之煙紫景蔚秀太虛萬仙輔翼朝宗乃大洞回風混合祕訣成真章千和萬合自然成真玉文薛幽棲𧥶言修真之人千真和神萬道合氣真與神混體道與氣合形自然成真也真中有神長生大君子文度命君也在臍下命門宫諱夭真液字飛生上英絳衣元始狀嚴東注字吁員李少微注字曰吁育無英公子丑未肝神也在肝制三魂也又號元靈素君諱玄玄字合符紫衣蓮花冠白元尊神寅申肺神也在肺拘七魄也又號白元洞陽君諱鬱靈標字玄夷絶素衣蓮花冠薛幽棲𧥶無英白元二神居洞房宫宫在眉間直入二寸無英亦時在肝白元亦時在肺太一卯酉太一在腦總衆神也為身中百靈之尊衆神萬氣之主故稱太一諱務猷收字歸會昌又曰太一真諱規英字化元如嬰兒形黑上而赤下衣上紫繡下紫錦坐金牀與玉帳右手執北極之星左手執北斗頭戴通天之冠腰帶流金之火鈴司命辰戌上帝司命也在心主氣納生元也諱理明初字玄度卿其形白上而青下面圓正等黃衣芙蓉冠元始狀桃康巳亥合延午兩腎之神也桃康住臍保精根也號合會神姓桃諱康紫衣蓮花冠執長生玉籙在左下合延居腎守命門也號命門君亦姓桃諱回孩字合精朱衣芙蓉冠執天皇象符在右下桃康合延二神諱字乃交互而言非的正也存左手執北斗無英公子肝蓮花冠在紫衣桃康下蓮花冠玉籙左臍紫衣執長生思太一在青冠錦衣頭腰帶流金火鈴司命在黃衣心元始狀長生大君在臍下命門宫元始狀絳衣圖右手執北極一星不見白元尊神在素衣肺蓮花冠合延右臍朱衣執天皇下芙蓉冠象符執符把籙保命生根並執兆玉符玉籙保兆命元生根上遊上清出入華房上清布三華離便之房以內言之身中華房心也八冥之內八脈冥會也細微之中細微之中以通元氣下鎮人身泥丸腦也絳宫心也此諸真神以太一為主皆是上清太微宫中之神也分釋降氣下入人身之中故時復上遊上清出入三華之房大包八極細入毫芒下鎮人身則或在泥丸或處絳宫玄師曰太一含華如蓮太一之房如蓮華未開太一心包八脈上通含華九色內含五彩圖之太一含華如蓮玄師曰上清者心之華房也太一含華其形自然太一元君居之如蓮華之房心未開之丹華入冥者身有八脈冥會之處盡總於心也細微之中以通元氣同注泉源之所也如草木肢脈比人身赤文血脈之道路一體經絡之榮衛也中理五氣混合百神玄師曰中理五氣者理五神之妙氣於中元五氣之中百神混合於內也大洞回風混合之法十轉回靈萬氣齊仙萬氣者萬神也天尊説經十遍天開為之十轉則回百靈以成性變萬氣以俱仙玄師曰十轉之法天尊十遍説經五行生成之道也先五遍則得五行之生數聾盲喑啞跛痾痼疾痊愈復形後五遍則得五行成數乃至聖胎疑靈回骸起死枯骨變仙更生成人也詳載大法此二章乃靈中之靈寶中之寶上品之首所謂玉晨道君云受元始度人無量上品者是斯也街華章仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因終八方法輪之門中有罪福之場各有禁戒宿命因緣事迹具載法輪經普受開度死魂生身身得受生上聞諸天諸天之上各有生門權道圖云開門人道乾宫通天之絳宫休門釋道坎宫通天之明堂生門仙道艮宫通天之玉堂此三門在三天之上吉道也出之遇福死門鬼道坤宫與死氣相通杜門業道巽宫入死户傷門地獄道震宫驚門畜生道兊宫此二門乃二氣交分之路景門神道離宫在陽氣終絶之地然此八門有吉有凶凶則死户吉則生門故經云諸天之上各有生門雖凶門亦有通天受生之吉道已上正文元始天尊所説玉晨道君紀録三界章中有空洞謡歌之章魔王靈篇辭參高真此玉晨道君紀述第一欲界飛空之音欲界六天自皇曾天至魔夷天也中有魔王諱郁默作飛空之歌欲界最居下位故云第一人道眇眇仙道莽莽鬼道樂兮當人生門天道貴生鬼道貴終仙道常自吉鬼道常自凶高上清靈爽悲歌朗太空唯願仙道成不欲人道窮北都泉曲府中有萬鬼羣但欲遏人算斷截人命門阿人歌洞章以攝北羅酆束送妖魔精斬馘六鬼峯薛幽棲注斷首曰斬截耳曰馘酆山有六峰峰各一官既有六宫故云六鬼峰六宫名見前章北都羅酆注李少微注作鋒六天鬼賊也鋒言其先鋒鋒鋭也諸天氣蕩蕩我道日興隆第二色界魔王之章自越衡天至曇誓天凡一十八天為色界謂在欲界之上故云第二魔王諱摩羅落落高張二十八宿也明氣四騫光華如此也梵行諸天周回十方二十八宿訣元綱流演之法也無量大神皆由我身我有洞章誦洞章法按大法玄師曰西元龜山元録內有丹皇飛玄紫文空洞靈章是色界魔王稱我有洞章者正此文也龜山丹皇飛玄紫文空洞靈章飛玄紫氣凝靈根法曰飛玄自然紫雲之氣元始祖氣也天元之靈根見前元綱流演法綱維玉虛總萬神空中鬱勃結自然飛玄之氣鬱勃自然凝結太空之中上有稜層十二傳玉樓峨峨耀景雲流精紫闕帶金軒瓊堂瑋鑠繞八騫八騫者八景也重樓十二金臺玉樓九宫三田十二神室上有流精紫闕金華之堂瓊瑶之室有自然紫雲之氣見前元綱流演法中有青金九靈仙丹房真母號精延按大法玄師曰中有梵氣之主雌一真母居為九靈太妙白玉龜臺玉光金真梵氣祖母元君青金丹皇大道君也又曰下元梵氣之母合延之神也飛青羽襡晨嬰冠服色也手執玉節握靈幡五色命魔對帝尊存手握五色命魔寶幡乘空步虛至玉京山上朝元始也宗壇祕訣命魔密呪具載甚詳兹舉其略把持符籍當生門執符把籙保命生根咀日嚼月吸醴泉採日月之精華金醴玉泉見前章開明三景注離羅吐輝鍊五魂即中理五氣也內充外溢絳府欣內外常冥也絳府心也金光煥煥形正圓圓象也從朔入金色渾淪朔北也腎屬北水宫金西也肺屬西金宫按元綱流演法人之元氣發自明堂宫右腎命門上屬西北乾方紐太淵府黃氣上入於心心屬火絳宫左旋流循腦後玉枕宫循入左目日宫右旋下歷足少陰大指流轉一身旋轉右肩入右目月宫然後回度五常從三十五分脊骨流入下丹田左腎水宫衝入肝木經肝土中丹田次過肺金宫從十二重樓喉管通至泥丸宫上丹田囟門靈谷總出上元唯有開明曉此言本經後序曰得道者乃當洞明至言也日五月十朝北元修其道常以正月二月三月四月六月七月八月十月十一月十二月五月九月不在行持一年計十月每月三日五日七日九日十五日一月五遍清齋誦飛玄紫文內思如法一月計五日見注後刻見華蓋領仙君紫氣左回與斗連歷度四七二十八宿也入金門元綱流演之法存思北斗華蓋之中有紫雲之氣從斗罡左回歷度二十八宿竟還金門之上叩齒心拜正是丹皇校萬仙有明此訣加精勤祕念密思每令分妙景感會得要文三年當審保長存九年乘空駕羽裙鳳衣輕翔升龍山俯仰九靈謁玉晨得為靈寶大真人雙手玉清訣頂碧玉七辰交泰冠青羽飛雲之衣朱履絳裙佩靈寶三境神劍負五色圓象修其道常以正月二月三月四月六月七月八月十月十一月十二月五月九月不在行持一年計十月每月三日五日七日九日十五日一月五遍清齋誦飛玄紫文一遍以夜半後露出中庭仰思北斗華蓋之中有紫雲之氣從斗罡左回歷度二十八宿竟還金門之上若天陰無光當於室內默念內思如法每令分明思畢心拜四過叩齒三通仰祝曰天庭朗清大洞經云眉間入一寸為明堂三寸為丹田亦名泥丸宫明堂上一寸為天庭宫紫微夫人呪曰開通天庭使我長生幽谷一作靈堂啓真幽谷下元腎宫也靈堂按大法西元王母內禁靈虛宮也流雲徘徊金華四騫中元金華金華宫與龍山連字三宫升降之法也丹皇敷輝雲飛紫軿是夕開陳青金校仙成我上願體應自然結命月華保年日根三靈合景即開明三景也永停龍山密行清披請如所言祝畢便口引紫氣二十八咽止行此三年刻有神仙降兆寢席也身有紫雲映絡一形九天書名九年必獲上仙也此章亦名鍊度金門大呪萬遍成仙按大法一月五遍依洞章法取斗中紫氣萬遍名外侍八瓊丹一千遍夜有神光出沒二千遍一身有光三千遍滿室有光四千遍舊病新疾殘靨宿痕皆去色反嬰童五千遍地司除死名玉清書生録百靈侍衛六千遍舉身有光洞照百步夜可細書鬼物不隱預知未然七千遍吹噓百物可起死尸八千遍呵呪五金皆成至寶光生圓象九千遍丹成如日面生金容骨秀五香三天注仙萬遍道備位證真人仙道貴度鬼道相連天地眇莽穢氣氛氛三界樂兮過之長存身度我界體入自然體入自然證大洞也此時樂兮薄由我恩龍漢蕩蕩何能別真我界難度故作洞文變化飛空以試爾身成敗懈退度者幾人笑爾不度故為歌音第三無色界魔王歌曰自皓庭霄度天至秀樂禁上天為無色界四天謂在色界之上故云第三魔王諱韶三界之上眇眇大羅上無色根雲層峨峨唯有元始浩劫之家部制我界統承玄都有過我界身入玉虛身入玉虛證大洞為仙真也我位上王匡御衆魔空中萬變穢氣紛葩保真者少迷惑者多仙道難固鬼道易邪人道者心諒不由他仙道貴實人道貴華爾不樂仙道三界那得過其欲轉五道我當復奈何三界歌章乃魔王所述皇人所書道君所紀非二章也此三界之上飛空之中魔王歌音音參洞章誦之百遍名度南宫誦之千遍魔王保迎萬遍道備飛升太空過度三界位登仙公玄師曰此是誦三界魔王歌章非二章也敬形章有聞靈音魔王敬形敕制地祇戌文至受鍊更生三十二字敕制地祇之文黑書敕當處土地令敬迎誦章學士也侍衛送迎某人拔出地户五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生戌文挑玄師曰心形皈信諦聽誦者遂獲九品善果敕制乃元始天尊所降玉晨道君所述是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地嶽禍及七祖翁天寶章道言此二章按大法玄師曰二章者前章自元始洞玄靈寶本章至列言上清是一章也後章自元洞玉曆至辭參高真是二章也三界歌章非二章止是魔王所述並是諸天上帝及至靈魔王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都紫微上宫依玄科四萬劫一傳若有至人齎金寶質心依舊格告盟十天然後而付焉傳付授受之條上天之科立四萬劫乃舊劫之格十夭東方九氣青夭南方三氣丹天西方七氣素天北方五氣玄天東北東南西南西北四梵氣天上方一氣昊天下方一十二氣皇天告盟十天大券朱書面乎十天而分之元始無量度人上品經法卷之三
