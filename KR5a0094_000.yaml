front:
  text: 謹按靈寶經法秋一凡九品陰功及消禳災害并自用祈福度厄行功存身為元始天尊坐空浮五色獅子之上居日光中
  hash: sha256:813e646a0c929bbdc28a238a91ab7c45be5ca8cbe7b6e522d33c33a7c40841c4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0094_HFL_000-001a, image: hfl/0047/0047-004.png}
body:
  text: 天地父母國王及天象可以神誦上丹田神誦四千遍為灾厄及他人可以心誦中丹田心誦三千遍為一切亡殁幽魂可以氣誦下丹田氣誦三千遍每一存思須得十遍十遍為一過百遍為十過十言一叩齒以召神百言一咽津以和氣錯一宇却前三十字以誦之越一字再覆五十字以誦之誦則下聲而誦之詠則朗吟以詠聲使音句周竟勿令匆速苟貪遍數常令神魂悅暢香氣綿綿不絶於室若以音聲華美急逐遍數亦無靈感空尸誦經欲飛返沈非徒無益亦招輕誦之愆玉几仙降筆混淪未判中存得一之靈大塊既分內抱生三之寶散而為氣聚則成文彌綸空洞之中羅絡虛玄之表元綱流演立天地之精根萬範開張布陰陽之血脉五文普植三景齊明開天三十二重結氣百千萬道于以保制劫運輔贊皇圖作回生起死之玄機為入聖超凡之要妙演三洞皆言有作教一國盡達無為藏靈寶於身田納黍珠於性地舉一念入大浮黎二開重樓登鬱羅蕭臺常親自己之虛皇頓悟惟心之元始悠悠庶類皆成不死真神蠢蠢羣靈咸曰長生大聖
  hash: sha256:61a8cfab424de8a5f0dcfab8d93913e4135e92100c0fc36e4005b4da48e7dac3
