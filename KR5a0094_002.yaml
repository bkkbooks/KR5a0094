之元太上以三九運梵三五乘元合四十二氣以開始青天元祖氣明東方始青之元應九陽木王之初故東方得九氣以分天境劫號龍漢次九因重復陽氣開明赤文流光敷落五度開圖丹書太上以三乘五三轉朱英合二十四氣以開南丹天元祖氣明南方丹光之元應三陽火王之初故南方得三氣以分天境劫號赤明次復九因重積中黃化元天緯周躔梵元乘五太上以五五三徊混陽十二合五十二氣以開中黃夭元祖氣明中靈黃華之元應五陽土王之初故中央得一十二氣以分天境劫號上皇次九元復因素景肇陽七明煥梵五緯乘天太上以七五三乘合三十六氣以開素靈天元祖氣明西華皓景之元應七陽金王之初故西方得七氣以分天境劫號延康次復九因周竟混化歸本一氣肇明太上以二五乘十三積元陽合三十氣以開北玄天元祖氣明玄冥上景之元應一陽水王之初故北方得五氣以分天境劫號開皇是以五劫既周昊夭成象一氣混道八境流光三積九乘八方開景八帝示形九霄分化故元始天尊命天真皇人以玉曆紀元洞混化之初劫運流復之本諸天分境結元洞正陽之氣為玉曆以紀天真天民劫運功積升退之道明九聖九品之階其諸玄祕别有九品仙籙經具載其詳五劫五氣龍漢始青之氣青赤明丹光之氣赤上皇中靈之氣黃延康素華之氣白開皇元陽之氣黑東方玉字真文龍漢始青玉曆寶章開九陽天元梵華氣九陽回妙氣三景散元精碧靄浮靈篆青林粲淑英超遙玉清府遼邈蓬萊瀛真化通無間神風滋萬生南方玉宇真文赤明丹光玉曆寶章開三陽天元梵靈氣浩劫開神運龍文泛赤霞八威奔電激九鳳破凶邪鍊度丹皇室飛升元始家炎明常繼照靈慶集晨華中央玉字真文上皇中靈玉曆寶章開五陽天元梵寶氣混黃生一氣感化結真形上德持柔順含光洞杳冥建中該九極執本統三辰煒燁天端上飛芒曜玉靈西方玉字真文延康素靈玉曆寶章開七陽天元梵英氣皇老儲靈粹金精曜斗威六天咸馘滅萬寶復幽微爽氣浮高闕寒光藹素輝空同披玉勒華麗九霄飛北方玉字真文開皇玄上玉曆寶章開一陽天元梵混氣五氣符元妙諸天混太冥辰精飛羽黑玉女散華青紫策封天寶玄光凛帝庭羣魔欽至化萬國保安寧元始無量度人上品經法卷之二
