front:
  text: 元始無量度人上品經法卷之二秋二
  hash: sha256:8b713d339c7a134e339812b64afbc307892cca24ba3302ebeefd30a2b7cd6d42
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0094_HFL_002-001a, image: hfl/0047/0047-076.png}
body:
  text: 太上三五都功職籙弟子陳椿榮集注元始無量度人上品妙經皇人曰此乃道君標目前題太上洞玄靈寶者玉晨道君序經故以道言標首此題直云元始無量度人者是夭尊自説以元始為題又自然已前亦是道君小序混洞已後方是天尊本章洞玄章元始洞玄靈寶本章此是皇人標題內名也上品妙首玄師曰元者萬道之祖始者衆氣之宗洞者神應靈感玄者變景莫測靈者有求必化寶者仙真聖根此之六字以為萬道之祖衆氣之宗歸於大洞之中則為上品妙首也十回度人此天尊十遍説經十轉回靈之法也百魔隱韻離合自然此四句皇人總明一經宗旨大意二十四字乃洞玄本章之首玄師曰其章中之旨乃百魔隱韻或離或合皆在自然百魔者九霄大魔帝君之王與上帝元始同化玉清元氣皇胄之胤嗣也神霄玉清王紫霄玉清消魔王丹景中極保景王青霄玉清洞明照王玉霄妙化王次太霄碧霄景霄琅霄玉清王亦大魔之帝也次九天大魔三天大魔三界大魔三清大魔五帝大魔諸夭大魔梵夭靈君之魔次三省天相太玄之魔比魔非魔靈魔制魔神魔等至六夭大魔隱韻皆典二章之中以洞妙百魔之音離合而成章赤文章太極妙化神靈混洞赤文章元始開運太玄肇靈虛極無象一氣流形化生二景五緯凝精混合自然怛除結嬰總真布景煥赫九清炎池廓奕七紀齊并祈師盧浩丹天耀晶朱光煉度赤靄散明三華鬱秀輝映帝晨太極妙化神靈混洞赤文章者攝化九陽而明天度以成九霄九天之境是以神霄玉清虛皇天泛上靈景華九陽清真虛梵之氣而成天境丹霄南極玉文天泛丹靈妙華洞陽景真元梵之氣而成天境碧霄太虛真極天泛廣靈太華上陽元真靈一之氣而成天境玉霄玉靈素華天泛玉靈素華純陽至真元一之氣而成天境太霄太靈真元夭泛太靈洞華三陽九真太一之氣而成天境琅霄素靈皓元天泛素靈皓華六陽洞真至一之氣而成天境紫霄元靈上極天泛元靈紫華清陽妙真天一之氣而成天境景霄妙靈寶華天泛妙靈寶華景陽精真虛一之氣而成天境青霄玉華無極天泛青靈玉華元陽天真純一之氣而成天境此九霄九夭皆混洞赤文之所化梵天天境者也混洞赤文雙手掐玉清文無無上真混者混沌之名洞者洞陽之氣五字生於大梵之先至赤明劫元始運洞陽之火冶鍊而成赤文言玉字赤文齊混沌之初在天地之先凝化空洞之上鬱結太無之中太無之無亦無其無既無其無故曰無無上真也元始祖劫化生諸天祖始也玄元始氣於始初之劫欻然化生五億諸天始劫者世界初生未經成敗也內象丹旨曰元始者乃先天虛無自然租氣在人謂之自己曩劫不壞元神開明三景是為天根二儀分形三光垂耀皆稟始氣故為天根內象丹旨經曰道生一一生二二生三三生萬物故虛無自然本起經曰夫道得三乃成故言三合成德自不滿三諸事不成擊辭曰易有太極是生兩儀蓋由一氣而分清濁是為三也九天生神章經云三氣合生九氣三氣為天地之尊九氣為萬物之根三因成九為萬物之根是為三生萬物三合成德在道為三氣在物為三才在夭為三光在人為三元皆元始之祖氣作萬物之本根故開明三景是為天根以內而言假設法象則曰鉛汞砂也直指其物則是本有之性與夫日用妙化陰陽之二氣也人雖知此本有之性則明妙而莫知本有之性繼種於坤宫兩腎之間即先天虛無自然純精真一之氣陰陽妙化自此發生詳見於丹旨混洞赤文元始祖劫注夫天地之間萬物先有本而後有根若果之有核是其本也種之於土陰陽激薄則坼萌芽而生根故能長茂華實生生不窮苦無根株而欲其本之久存者未之有也故天尊先指祖氣而為道之本次明三景而為道之根大法靈寶有開明三景之道兆於日初出時平心向太陽祝鬱儀呪曰日魂朱景照韜緑英回霞赤童玄炎飈象引日紫氣八十一咽月初出時向太陰祝結璘呪曰月魄愛蕭芳艷翳寥婉虛靈蘭鬱華結翹淳金清瑩炅容臺標引月黃色氣一百二十咽夜戌末時仰視北斗祝北斗內諱魁𩲃𩵄䰢魓𩳐魒吸七星金光四十九咽服此三景真氣還精復胎三年功滿受書為三景真人又有內朝三景飛仙分形之道辰戌丑未四時朝中元心中司命神字玄堅中極太一君也主養兆一身之形質下在脾中脾為玉堂一名玉房叩齒五通存脾中黃氣有一真人如初生小兒黃衣冠祝曰中極玄堅太一真君甲欲得真人神仙黃庭之道寅卯午申四時朝上元太一神君號南極老人主兆魂魄胞神命氣胎府之父也叩齒九通存頭上直入一寸名太極宫又名太一宫赤黃氣滿宫有一真人如童子狀絳衣祝曰南極元老太一真君甲欲得神丹長生不死之道子酉巳亥四時朝下元北極玄道母字玄妙下在雙合宫中腎為雙合宫主兆精氣生死符籍之母也叩齒四通存腎中有白氣氣中有神龜龜上有玄女即靈妃坐龜也青白衣如初生小女子右有司録君左有司命君祝曰下元元神北極玄道母字玄妙甲欲得金體玉泉可飲食者乞敕司命司録削甲死籍更注長生日久行之常念勿忘乃洞玄三皇帝君所行實靈寶之密機亦盟天告師而行矣上無復祖唯道為身稟元如妙氣之自然而化成人道之法身夫道以虛無為宗以自然為本以道為身無復先祖也五文開廓皇人曰五又者五方五老赤書玉字內音也普殖神靈無文不光無文不明無文不立無文不成無文不度無文不生玉清文放訣五篇真文開廓形狀普生天地安置神靈無真文則日月不得光星辰不得明乾坤不得立世界不得成幽魂不得度枯骨不得生大梵章是為大梵天中之天龍蹻經曰三清天者四梵天以上太極宫所治太清十二天九仙所居九老所都金闕後聖所治次上清十二天九真所居玉晨道君所治次無上大羅玉清十二天九聖所居元始天尊所治是天中之天三十六天也鬱羅蕭臺蕭臺是七寶玄臺有九層映鬱大羅之上玉山上京太玄都玉山上京祖師元始天尊治玄都玉京上極無上大羅玉清大羅玉清京玉清祖師元始天尊宴居無上大羅之天聖師玉皇上帝治太微玉清宫總治種民天眇眇劫仞若亡若存三華離便諸天之上有三華堂離便宫三華者玉清三元宫也上元玉華中元金華下元九華皆三元上皇道君居之離便者玉清之境離宫便殿也大有妙庭上清妙庭宫宗師玉晨道君安處無色世界上清大有之天金闕玉房宗師玉晨道君治金闕寥陽宫真師太上老君治太清宫玉房者上清玉房宫森羅淨霐森羅上館淨霐二沼乃玉清殿下雨池也玄師曰以內言之泥丸九宫也此正是內朝元始之道也御注此九宫乃玉京雌雄九宫之名比人泥丸中太華中華少華三華屬木有玉清坤母居之離便屬火有上清玉妃居之大有屬土有黃素紫靈元君居之妙庭屬水有太玄神女居之此四宫為雌宫在玉京之北金闕宫有太素元老居之玉房宫有華陽帝君居之森羅宫有流珠真人居之淨妙宫有太一元王居之太霐宫有上元赤子居之此五宫為雄宫在玉京之南已上九官在玉京山之上列布區象如人之腦也以身推之無不相契但人窒昧而不知矣梵氣章雙手玉清文掐定大行梵氣玄師曰大行梵氣者己之元氣也詳明於圖中大行梵氣圖西龜山大行梵氣圖玄師曰梵氣之祖者西元王母也九靈太妙白玉龜臺玉光金真梵氣租母元君青金丹皇大道君金母居西龜之山亦曰龍山乃九氣之根紐真土之淵府西北之角亥子之間與玉清連界通於泥丸也南接通陽絳宫上通肺氣也下通內户日月之門丹房金宫在內腎方三寸北與內腎傍通十二神室中有梵氣之主雌一真母居焉梵氣日夜上朝若有塵心則失大行梵氣不能彌羅一身周回十方內象丹旨曰此先天純精真一之氣藏於坤宫兩腎之間者也妙化發生上至乾宫陽極陰生下降還元升降循環流行不息故曰周回十方也梵氣周回詳見元綱流演圖法中有度人不死之神度人不死之神名飛生主司度世不死事御注不死之神元始之分化也諱父寧在宇合母精中有南極長生之君南極宫中有度命君字吁員主司長生之名簡御注即長生大帝君亦曰南極注生大帝中有度世度世君諱諒道覺字勤明天主過度三災九厄司馬大神御注度人濟世司馬大神王諱規常生字彥道周主領赤甲神兵威伐六天陰邪鬼精之神也中有好生韓君丈人好生君諱猷神中之尊謂之丈人御注好生君青華宫垂福惠生之君諱廣從願字度夭慜中有南上司命司録延壽益算度厄尊神此皆南上洞陽宫中之神即南斗六司之真也回骸起死無量度人玉清文放訣此二句通結上文從中有度人至此諸司真宫皆能回骸起死度人成道也御注九天天曹有回骸起死君諱黨賢元字伯務真無量度人君諱理登纏字足皇明主南北二極太微紫微都糾之司玄師曰此諸神皆總氣於九天九天總氣於太微太微梵氣乃高上洞玄之氣入化身中已上正文乃元始天尊所説招真章今日校録諸天臨軒今日者赤明劫初大浮黎國開圖校録之日也十方神王當隨方掐訣召之叩齒一通心禮一拜東方震文無極飛天神王長生大聖無量度人神王內諱忽初一十一二十一日下降南方離文無極飛天神王長生大聖無量度人神王內諱飛初八十八二十八日下降西方兊文無極飛天神王長生大聖無量度人神王內諱善初四十四二十四日下降北方坎文無極飛天神王長生大聖無量度人神王內諱雲上初五十五二十五日下降東北艮文無極飛天神王長生大聖無量度人神王內諱度仙初二十二二十二日下降東南巽文無極飛天神王長生大聖無量度人神王內諱無鏡初三十三二十三日下降西南坤文無極飛天神王長生大聖無量度人神王內諱滌色初六十六二十六日下降西北乾文無極飛天神王長生大聖無量度人神王內諱那郁初七十七二十七日下降上方戌下亥上無極飛天神王長生大聖無量度人神王內諱玃無初九十九三十九日下降下方辰上巳下無極飛天神王長生大聖無量度人神王內諱瑛初十二十三十日下降玄師曰此十方飛天神王威德功力重大聖化不可思議於赤明劫初浮黎國中開圖校録之日奉元始至尊之命掌三界十方一切圖録並詣帝軒校量罪福紀録功過隨方品量無極度人凡諸度生救死遣飛天使者吏兵奏告神王乞行救度十方至真飛天神王長生度世無量大神並乘飛雲丹輿緑輦羽蓋瓊輪驂駕朱鳳午文五色玄龍辰文建九色之節十絶靈幡前嘯九鳳齊唱卯文前部屬陽陽數奇故九也後吹八鸞同鳴八卦訣後部屬陰陰數偶故八也獅子寅文白鶴戌文嘯歌雍雍酉文五老啓塗玉清文羣仙翼轅太清文至上清文挑億乘萬騎浮空而來五老五帝也十方大聖道位尊高乃感五帝前引羣仙參乘開啓道塗五符本行經云東方安寶華林青靈始老青帝姓閻諱開字威靈仰南方梵寶昌陽丹靈真老赤帝姓洞浮諱極炎字赤嫖弩中央玉寶元靈元老黃帝姓通班諱元良字含樞紐西方七寶金門皓靈皇老白帝姓上金諱昌開字曜魄鬱北方洞陰朔單玉寶五靈玄老黑帝姓黑節諱靈會字隱候局五老帝者皆天真自然之神故曰元始五老傾光回駕坤文傾光者流精玉光互相輝煥也回駕者飛雲輪轂回旋法座也監真度生寅文十方上聖朝集帝所監領衆真校度羣生諸天丞相中指掐大指根丞氣相氣能立造化萬物主者丞相大羅天之神公也為受度更生之賓輔弼諸天之事南昌上宫午文韓司主録離文韓君之司主監長生之録監生大神寅文即度生真人也字扶義執籙把籍齊到帝前隨所應度嚴校諸天中指下文已上正文玉晨道君敘述受度之旨普告章四十八字普告三界之誥命雙手掐玉清文普告三界欲界色界無色界也無極神鄉十方無極世界泉曲之府北都羅酆北下元右宫也北酆在天地之北癸地名酆都泉曲府羅酆是北都上山名伏魔經云下方正北有一大海穢惡腥黑莫測邊際中有一山高十萬六千里上參碧落下入風泉名曰北都羅酆山山近水面有一大洞名曰陰景天宫周回三萬六千里中有三十七獄主此洞者名曰太陰天君此洞之外山上别有六洞六天大魔各主其一即太陰天君外六曹也六曹小吏合有三十六萬人第一洞名曰紂絶陰天宫第二洞名曰泰煞諒事宗天宫第三洞名曰明晨耐犯武成天宫第四洞名曰恬照罪氣天宫第五洞名曰宗靈七非天宫第六洞名曰敢司連宛屢天宫經云能持此六宫名號生敬畏者即得魔王保舉削落死名生死受賴獲福無量已上六宫與太陰天君洞中六宫互相關報主執罪罰子司曹局因事受職千千萬萬何可勝言三官九署天地水三官也三官各有三府故曰九署按三元品戒經上元天官隸玉清境結青黃白三氣而置三宫中宫名元陽七寶紫微宫宫置左右中三府左府主生官太陽火帝考右府主死官太陰水帝考中府主生死罪福風刀之考左宫名大玄都元黃太極左宫即玉清左相宫也亦置三府右宫名太玄都洞白太極右宫是清微宫也亦置三府主考一同中宫上元三宫宫統三府府統四曹合三十六曹中元地官隸上清境結元洞混靈之氣凝極黃之精而成其中宫名洞靈清虛宫宫置左右中三府左號耐犯明晨府右號紂絶陰天府中號七非恬照府主考罪福不異上元左宫名南極洞陽宫宫置三府左號諒事府右號宗靈府中號靈如神府右宫名北酆宫一名陰天宫宫置三府左號連宛泉曲府右號泰煞九幽府中號罪氣咸池府中元三宫九府合四十二曹主考不異上元下元水官隸太清境結風澤之氣凝晨浩之精而成其中宫號暘谷洞泉宫一名青華方宫置左右中三府左號青元靈名府右號九泉寒夜府中號朔單青靈府左宫名青靈宫宫置三府左號靈劫府右號長夜府中號靈寶劫刃府右宫名酆都官宫置三府左號開度劫量府右號泉曲鬼神府中號通靈大劫府下元三宫九府共四十二曹主考不異中元三元總九宫二十七府百二十曹左主生事右主死事有功曹左府青簿有罪書右府黑簿若罪中涉福福中涉罪則不專一曹得道奏中宫有功奏左府有罪奏右府每至三元之日集校列奏三官十二河源玄師曰十二分野有十二水河之源湊於無極混海泄水於天河東井之源也成玄英注此明黃水之華鍊度死魂之事十二者年中十二月也河源者河即天河也天有二十八宿東井星是天河之源衆水之泉月為太陰之精諸水之母月行則每月一周夭一年十二月每月中有一日月交皆於東井華池之境吐水灌注此鍊度死魂之所故云十二河源以明其事又見三五順行經上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣玉清文挑符命章玉清文元始符命時刻升遷北都寒池部衛形魂制魔保舉法曰制魔保舉度人度品南宫死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三徒午坤巽文三官徒役也天徒諱可韓明人徒諱興生轉地徒諱獨隸遷斷絶天徒界上尸道色欲門免天官驅雷逐電之役午斷絶地徒界中尸道愛欲門免地官擔沙負石之役坤斷絶人徒界下尸道貪欲門免水官漣汲溟波之役巽五苦申寅亥巳酉文八難玄師曰三徒五苦合為八難度第一色纍苦心門免泰山地獄苦道申度第二愛纍苦神門免風刀地獄苦道寅度第三貪纍苦形門免擔沙負石苦道亥度第四華競苦精門免填海作河苦道巳度第五身纍苦魂門免吞火食炭鑊湯苦道酉超凌三界逍遙上清玉清文移至上清文挑已上正文元始天尊所降告命玉晨道君紀録寶諱章上清之天天帝玉真無色之境梵行音衡又下孟切玄師曰梵行者道中之道玄中之玄真空無礙也三界之上玉清之下太清之上有天帝曰玉真天帝乃昊天玉皇上帝玄穹高上天尊主治無色梵行之境是種民天界也又曰玉晨道君安處無色世界上清大有之天薛幽棲注景者身也色者質也無色之景則有景無色形相宛然猶如虛空故云梵行下孟切李少微注無色之景唯有大梵之氣流行平聲景境二宇與行字作兩音經旨皆通東方八天步斗牛女虛危室壁之罡依色取氣梵天中斗罡欲界六天六根俱染是名欲界經曰凡人口業淨有十善功以上得生欲界天中太黃皇曾天黃氣維角之天西北梵氣帝鬱繿玉明承奎壁二宿之分帝諱觀覺主長生籙居紫極宫治在北方亥之西六根俱染皇曾一天西北梵氣承奎壁二宿之分凡言梵者是四維之天維是角也其維之天不屬正宿但得兩邊宿氣相假而成故云梵氣已下三天倣此其四方正面之天係二十八宿之分太明玉完天緑氣帝須阿那田帝諱攬覺主度魂更生居紫房宫治在北方亥之東一欲根粗淨五欲根粗染清明何童天青器帝元育齊京帝諱大覺主敷布政教度脫天人居九晨宫治在北方壬之西二欲根粗淨四欲根粗染玄胎平育天赤氣帝劉度內鮮帝諱育元主召魂舉仙居元景宫冶在北方壬之東三欲根粗淨三欲根粗染元明文舉天蒼氣帝醜法輪帝諱梵雲主通行元氣居廣寒宫治在北方癸之西四欲根粗淨二欲根粗染上明七曜魔夷天黑氣帝恬懀延帝諱玉真主開度幽難居太陰宫治在北方癸之東五欲根粗淨一欲根粗染已上欲界天有形有欲觸物染著交接陰陽人民胎生故為欲界太真科曰初二天果報尚粗猶以身交為欲次二天以執手為欲第五天以口説為欲第六天以眼視為欲今緣六欲感此六天一根粗淨上進一天六欲總